<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 展示网页生成</title>
    <style>
        /* iOS 26 风格 */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1c1c1e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #f2f2f7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #98989d;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: #3a3a3c;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .input-field:focus {
            outline: none;
            background-color: #4a4a4c;
            box-shadow: 0 0 0 3px #0a84ff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkbox-group label {
            margin-left: 8px;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #0a84ff;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-button:hover {
            background-color: #38b4ff;
        }

        .submit-button:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }

        #password-field {
            display: none;
        }

        .info-message {
            margin-top: 15px;
            text-align: center;
            color: #8e8e93;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">生成展示页面</div>
        <form id="creator-form">
            <div class="form-group">
                <label for="file-upload">上传需要展示的网页</label>
                <input type="file" id="file-upload" class="input-field" required>
            </div>
            <div class="form-group">
                <label for="author-name">作者姓名（限英文）</label>
                <input type="text" id="author-name" class="input-field" pattern="[a-zA-Z]+" title="English characters only" required>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="require-password">
                <label for="require-password">是/否 需要密码</label>
            </div>
            <div class="form-group" id="password-field">
                <label for="password-input">密码</label>
                <input type="password" id="password-input" class="input-field">
            </div>
            <button type="submit" class="submit-button">生成文件并下载</button>
            <div class="info-message" id="message"></div>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('creator-form');
            const fileUpload = document.getElementById('file-upload');
            const authorNameInput = document.getElementById('author-name');
            const requirePasswordCheckbox = document.getElementById('require-password');
            const passwordField = document.getElementById('password-field');
            const passwordInput = document.getElementById('password-input');
            const messageDiv = document.getElementById('message');

            requirePasswordCheckbox.addEventListener('change', () => {
                passwordField.style.display = requirePasswordCheckbox.checked ? 'block' : 'none';
                passwordInput.required = requirePasswordCheckbox.checked;
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                messageDiv.textContent = 'Processing... Please wait.';

                const uploadedFile = fileUpload.files[0];
                const authorName = authorNameInput.value;

                if (!uploadedFile) {
                    messageDiv.textContent = 'Please upload a markdown file.';
                    return;
                }

                try {
                    // Read the content of the uploaded markdown file
                    const userFileContent = await uploadedFile.text();

                    // Fetch the standardMarkdown.html content (assuming it's in the same directory)
                    const standardMdResponse = await fetch('standardMarkdown.html');
                    if (!standardMdResponse.ok) {
                        throw new Error('Failed to fetch standardMarkdown.html. Please ensure it exists.');
                    }
                    const standardMdContent = await standardMdResponse.text();

                    // Replace the placeholder with user's content
                    const finalHtmlContent = standardMdContent.replace('??!??', userFileContent);

                    // Create the index.html file content
                    const htmlFileContent = `
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                            <title>${authorName}</title>
                            <style>
                                body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: auto; padding: 20px; }
                                h1, h2 { border-bottom: 1px solid #eee; padding-bottom: 5px; }
                            </style>
                        </head>
                        <body>
                            ${finalHtmlContent}
                        </body>
                        </html>
                    `;

                    // Create the info.json file content
                    const infoJson = {
                        author: authorName,
                        ifUsePassword: requirePasswordCheckbox.checked,
                        password: requirePasswordCheckbox.checked ? 'hidden' : null,
                        generationDate: new Date().toISOString()
                    };
                    const jsonFileContent = JSON.stringify(infoJson, null, 2);

                    // Create a new JSZip instance
                    const zip = new JSZip();
                    zip.file('index.html', htmlFileContent);
                    zip.file('info.json', jsonFileContent);

                    // Determine the zip file name
                    let zipAuthorName = authorName.substring(0, 3).padEnd(3, 'X');
                    const zipFileName = `${zipAuthorName}_001.zip`;

                    // Generate the zip file and trigger download
                    const blob = await zip.generateAsync({ type: 'blob' });
                    saveAs(blob, zipFileName);

                    messageDiv.textContent = 'Files generated and download started!';

                } catch (error) {
                    console.error('Error:', error);
                    messageDiv.textContent = `An error occurred: ${error.message}`;
                }
            });
        });
    </script>
</body>
</html>
