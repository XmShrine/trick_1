<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Immersive Reader</title>

    <!-- 1. 引入 KaTeX (数学公式) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- 2. 引入 Marked (Markdown 解析) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* --- iOS Future Dark Theme --- */
        :root {
            --bg-color: #000000;
            --text-primary: #F2F2F7;
            --text-secondary: #8E8E93;
            --text-reading: #D1D1D6; /* 降低对比度，护眼 */
            --accent: #0A84FF;       /* iOS Blue */
            --glass-panel: rgba(28, 28, 30, 0.75);
            --border-light: rgba(255, 255, 255, 0.12);
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-reading);
            font-family: var(--font-stack);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            font-size: 19px;
            overflow-x: hidden;
        }

        /* --- Header (极简，自动隐藏) --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            opacity: 0.8;
        }

        /* --- Main Content --- */
        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 80px 24px 120px; /* 底部留出控制条空间 */
            min-height: 100vh;
        }

        /* Markdown Styles */
        h1, h2, h3 { color: var(--text-primary); font-weight: 700; letter-spacing: -0.5px; margin-top: 2em; }
        h1 { font-size: 2em; border-bottom: 1px solid var(--border-light); padding-bottom: 0.3em; }
        h2 { font-size: 1.5em; }
        p { margin-bottom: 1.5em; text-align: justify; }
        
        /* Math Formula Scroll */
        .katex-display { overflow-x: auto; padding: 10px 0; }
        
        /* Code Blocks */
        pre {
            background: #1C1C1E;
            border-radius: 14px;
            padding: 16px;
            overflow-x: auto;
            border: 1px solid var(--border-light);
        }

        /* --- Floating Control Bar (The "Dynamic Island" Scrubber) --- */
        .control-bar {
            position: fixed;
            bottom: calc(20px + var(--safe-area-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 50px;
            background: rgba(35, 35, 35, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 200;
            transition: opacity 0.3s, transform 0.3s;
        }

        /* 隐藏状态 */
        .control-bar.hidden {
            opacity: 0.3;
            transform: translateX(-50%) translateY(10px) scale(0.95);
            pointer-events: none; /* 防止误触 */
        }
        /* 触摸或者滚动结束时显示 */
        .control-bar:hover, .control-bar.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Custom Range Slider (Scrubber) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 100%;
            cursor: pointer;
            margin: 0;
        }

        /* Slider Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            border: none;
        }

        /* Slider Thumb (Handle) */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            margin-top: -8px; /* Center text vertically */
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.3);
            background: var(--text-primary);
        }

        .page-info {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-primary);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        
        .control-bar:active .page-info {
            opacity: 1;
        }

    </style>
</head>
<body>

    <header id="header">
        <div class="header-title" id="book-title">Reading</div>
    </header>

    <main id="content">
        <!-- 内容将被 JS 渲染到这里 -->
    </main>

    <!-- 底部控制条 -->
    <div class="control-bar" id="control-bar">
        <!-- 显示百分比提示 -->
        <div class="page-info" id="page-info">0%</div>
        <!-- 进度滑块 -->
        <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1">
    </div>

    <!-- ========================================== -->
    <!--     请将你的 Markdown 内容粘贴在下面       -->
    <!-- ========================================== -->
<script id="raw-markdown" type="text/plain">
# 这是一个示例文档

这里是第一章的内容。你可以在这里粘贴你的小说内容，支持 **Markdown** 格式。

## 1. 数学公式支持
这是一个行内公式：$E = mc^2$。

这是一个块级公式：
$$
i\hbar\frac{\partial}{\partial t}\psi = \hat{H}\psi
$$

## 2. 这是一个长段落测试
（请粘贴你的长篇小说内容替换这里...）

Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.

### 2.1 子标题
继续测试滚动条功能。
</script>
    <!-- ========================================== -->

    <script>
        // 1. 初始化渲染
        document.addEventListener('DOMContentLoaded', () => {
            const rawMd = document.getElementById('raw-markdown').textContent;
            const contentDiv = document.getElementById('content');
            
            // 提取标题
            const lines = rawMd.trim().split('\n');
            if(lines.length > 0 && lines[0].startsWith('#')) {
                const title = lines[0].replace(/#+\s*/, '');
                document.getElementById('book-title').innerText = title;
                document.title = title;
            }

            // 解析 Markdown
            contentDiv.innerHTML = marked.parse(rawMd);

            // 渲染 MathTeX
            renderMathInElement(contentDiv, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError : false
            });
        });

        // 2. 交互逻辑：进度条与滚动
        const scrubber = document.getElementById('scrubber');
        const controlBar = document.getElementById('control-bar');
        const header = document.getElementById('header');
        const pageInfo = document.getElementById('page-info');
        let isDragging = false;
        let scrollTimeout;

        // 计算最大滚动距离
        function getMaxScroll() {
            return document.documentElement.scrollHeight - window.innerHeight;
        }

        // 监听页面滚动 -> 更新进度条
        window.addEventListener('scroll', () => {
            if (!isDragging) {
                const max = getMaxScroll();
                const current = window.scrollY;
                const percentage = (current / max) * 100;
                scrubber.value = percentage;
                updatePageInfo(percentage);
            }

            // 滚动时隐藏/显示 Header 和 ControlBar
            handleUIVisibility();
        });

        // 监听进度条拖动 -> 更新页面位置
        scrubber.addEventListener('input', (e) => {
            isDragging = true;
            const percentage = e.target.value;
            const max = getMaxScroll();
            const targetY = (percentage / 100) * max;
            
            window.scrollTo(0, targetY);
            updatePageInfo(percentage);
            
            // 拖动时保持 UI 显示
            showUI();
        });

        scrubber.addEventListener('change', () => {
            isDragging = false;
        });

        // 触摸/鼠标交互优化
        scrubber.addEventListener('touchstart', () => { isDragging = true; showUI(); });
        scrubber.addEventListener('touchend', () => { isDragging = false; });

        function updatePageInfo(val) {
            pageInfo.innerText = Math.round(val) + "%";
        }

        // UI 自动隐藏逻辑 (沉浸式体验)
        let lastScrollY = window.scrollY;
        
        function handleUIVisibility() {
            const currentScrollY = window.scrollY;
            
            // 向下滚动 且 不在顶部 -> 隐藏 Header
            if (currentScrollY > lastScrollY && currentScrollY > 50) {
                header.style.transform = 'translateY(-100%)';
            } else {
                header.style.transform = 'translateY(0)';
            }

            // 滚动时让进度条半透明，停止滚动后恢复
            controlBar.classList.add('hidden');
            controlBar.classList.remove('active');
            
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                controlBar.classList.remove('hidden');
                controlBar.classList.add('active');
            }, 600); // 停止滚动 0.6秒后显示控制条

            lastScrollY = currentScrollY;
        }

        function showUI() {
            controlBar.classList.remove('hidden');
            controlBar.classList.add('active');
            header.style.transform = 'translateY(0)';
            clearTimeout(scrollTimeout);
        }

        // 点击页面任意位置唤醒 UI
        document.addEventListener('click', (e) => {
            // 如果点击的不是控制条本身
            if (!e.target.closest('.control-bar')) {
                showUI();
            }
        });

    </script>
</body>
</html>
