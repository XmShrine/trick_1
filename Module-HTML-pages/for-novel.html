<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Immersive Reader</title>

    <!-- 1. 引入 KaTeX (数学公式) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- 2. 引入 Marked (Markdown 解析) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* --- iOS Future Dark Theme --- */
        :root {
            --bg-color: #000000;
            --text-primary: #F2F2F7;
            --text-secondary: #8E8E93;
            --text-reading: #D1D1D6;
            --accent: #0A84FF;
            --border-light: rgba(255, 255, 255, 0.12);
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-reading);
            font-family: var(--font-stack);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            font-size: 19px;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            opacity: 0.8;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Main Content --- */
        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 80px 24px 150px;
            min-height: 100vh;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Typography */
        h1, h2, h3 { color: var(--text-primary); font-weight: 700; margin-top: 2em; }
        h1 { font-size: 2em; border-bottom: 1px solid var(--border-light); padding-bottom: 0.3em; }
        h2 { font-size: 1.5em; }
        p { margin-bottom: 1.5em; text-align: justify; }
        a { color: var(--accent); text-decoration: none; }
        
        /* Math & Code */
        .katex-display { overflow-x: auto; padding: 10px 0; }
        pre {
            background: #1C1C1E;
            border-radius: 14px;
            padding: 16px;
            overflow-x: auto;
            border: 1px solid var(--border-light);
            margin: 1.5em 0;
        }
        code { color: #FF9F0A; font-family: monospace; font-size: 0.9em; }
        pre code { color: inherit; }

        /* --- Scrubber (Dynamic Island Style) --- */
        .control-bar {
            position: fixed;
            bottom: calc(20px + var(--safe-area-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 50px;
            background: rgba(35, 35, 35, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex; align-items: center; padding: 0 20px;
            z-index: 200;
            transition: opacity 0.3s, transform 0.3s;
        }

        .control-bar.hidden {
            opacity: 0.3;
            transform: translateX(-50%) translateY(10px) scale(0.95);
            pointer-events: none;
        }
        .control-bar:hover, .control-bar.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 100%; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #ffffff; margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform 0.1s; }
        input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }

        .page-info {
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 12px;
            font-size: 12px; color: var(--text-primary); opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .control-bar:active .page-info { opacity: 1; }

        /* Error State */
        #error-msg { text-align: center; margin-top: 100px; display: none; padding: 20px; }
        .btn-retry { margin-top: 20px; background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header id="header">
        <div class="header-title" id="book-title">Loading...</div>
    </header>

    <div id="error-msg"></div>
    <main id="content"></main>

    <div class="control-bar" id="control-bar">
        <div class="page-info" id="page-info">0%</div>
        <input type="range" id="scrubber" min="0" max="100" value="0" step="0.01">
    </div>

    <script>
        // 配置：目标文件名
        const CONTENT_FILE = 'content.md';

        const contentDiv = document.getElementById('content');
        const titleElem = document.getElementById('book-title');
        const errorDiv = document.getElementById('error-msg');

        // 1. 获取并渲染内容
        async function loadNovel() {
            try {
                const response = await fetch(CONTENT_FILE);
                
                if (!response.ok) {
                    throw new Error(`无法加载文件: ${response.status}`);
                }

                const markdownText = await response.text();
                
                // 提取标题
                const lines = markdownText.trim().split('\n');
                if(lines.length > 0 && lines[0].startsWith('#')) {
                    const title = lines[0].replace(/#+\s*/, '');
                    titleElem.innerText = title;
                    document.title = title;
                } else {
                    titleElem.innerText = "Untitled Story";
                }

                // Markdown 转 HTML
                contentDiv.innerHTML = marked.parse(markdownText, {
                    breaks: true, // 允许换行符直接换行
                    gfm: true
                });

                // 渲染数学公式
                renderMathInElement(contentDiv, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError : false
                });

                // 初始化 UI 状态
                contentDiv.style.opacity = '1';

            } catch (err) {
                console.error(err);
                contentDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                
                // 友好的错误提示
                const isLocal = window.location.protocol === 'file:';
                let msg = `<h3 style="color:#FF453A">加载失败</h3><p>${err.message}</p>`;
                
                if (isLocal) {
                    msg += `<div style="background:#1c1c1e; padding:15px; border-radius:10px; font-size:14px; text-align:left; color:#8E8E93; margin-top:20px;">
                        <strong>⚠️ 浏览器安全限制</strong><br><br>
                        直接双击打开 HTML 无法读取外部文件 (CORS 策略)。<br>
                        <strong>解决方法：</strong>
                        <ol style="margin-top:10px; padding-left:20px;">
                            <li>使用 VS Code 插件 "Live Server" 打开。</li>
                            <li>或者在终端运行: <code>python3 -m http.server</code></li>
                            <li>或者将文件上传到 GitHub Pages / Vercel 等静态网站托管。</li>
                        </ol>
                    </div>`;
                }
                errorDiv.innerHTML = msg;
            }
        }

        loadNovel();

        // 2. 交互逻辑 (Scrubber & Header)
        const scrubber = document.getElementById('scrubber');
        const controlBar = document.getElementById('control-bar');
        const header = document.getElementById('header');
        const pageInfo = document.getElementById('page-info');
        let isDragging = false;
        let scrollTimeout;

        function getMaxScroll() {
            return document.documentElement.scrollHeight - window.innerHeight;
        }

        // 滚动监听
        window.addEventListener('scroll', () => {
            if (!isDragging) {
                const max = getMaxScroll();
                if (max <= 0) return;
                const current = window.scrollY;
                const percentage = (current / max) * 100;
                scrubber.value = percentage;
                updatePageInfo(percentage);
            }
            handleUIVisibility();
        });

        // 拖动监听
        scrubber.addEventListener('input', (e) => {
            isDragging = true;
            const percentage = parseFloat(e.target.value);
            const max = getMaxScroll();
            window.scrollTo(0, (percentage / 100) * max);
            updatePageInfo(percentage);
            showUI();
        });

        scrubber.addEventListener('change', () => { isDragging = false; });
        scrubber.addEventListener('touchstart', () => { isDragging = true; showUI(); });
        scrubber.addEventListener('touchend', () => { isDragging = false; });

        function updatePageInfo(val) {
            pageInfo.innerText = Math.round(val) + "%";
        }

        // 自动隐藏 UI
        let lastScrollY = window.scrollY;
        
        function handleUIVisibility() {
            const currentScrollY = window.scrollY;
            
            // Header 逻辑
            if (currentScrollY > lastScrollY && currentScrollY > 50) {
                header.style.transform = 'translateY(-100%)';
            } else {
                header.style.transform = 'translateY(0)';
            }

            // Scrubber 逻辑
            controlBar.classList.add('hidden');
            controlBar.classList.remove('active');
            
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                controlBar.classList.remove('hidden');
                controlBar.classList.add('active');
            }, 600);

            lastScrollY = currentScrollY;
        }

        function showUI() {
            controlBar.classList.remove('hidden');
            controlBar.classList.add('active');
            header.style.transform = 'translateY(0)';
            clearTimeout(scrollTimeout);
        }

        // 点击唤醒
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.control-bar')) {
                showUI();
            }
        });

    </script>
</body>
</html>
