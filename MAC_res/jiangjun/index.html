<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载</title>
    <style>
        /* 通用样式和字体 */
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 头部样式 */
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-button {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #222;
        }

        .page-title {
            font-size: 2.5em;
            font-weight: bold;
            margin: 0;
        }

        /* 下载区域样式 */
        .download-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .version-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #111;
            padding: 15px 20px;
            border-radius: 12px;
        }

        .version-item p {
            margin: 0;
            font-size: 1.1em;
        }

        .download-button {
            background-color: #007aff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        .download-button:hover {
            background-color: #005bb5;
        }

        /* 分隔线样式 */
        .divider {
            border: none;
            border-top: 1px solid #333;
            margin: 40px 0;
        }

        /* Markdown 内容样式 */
        .markdown-container {
            padding: 20px;
            background-color: #111;
            border-radius: 12px;
        }
        
        /* 覆盖代码高亮的样式 */
        pre {
            background-color: #1a1a1a !important;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
        }
        
        /* 覆盖 Markdown 默认样式 */
        h1, h2, h3, h4, h5, h6 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 0.3em; margin-top: 1.5em; }
        a { color: #007aff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        p, ul, ol, blockquote { line-height: 1.6; }
        ul, ol { padding-left: 20px; }
        blockquote { border-left: 4px solid #333; padding-left: 15px; color: #aaa; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        .katex {
            font-size: 1.1em;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../index.html" class="back-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.5 19L8.5 12L15.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <h1 class="page-title">将军太阳资源包下载</h1>
        </header>

        <section class="download-section">
            <div class="version-item">
                <p>稳定版</p>
                <a href="jiangjun.zip" class="download-button" download>下载</a>
            </div>
        </section>

        <hr class="divider">

        <main class="markdown-container">
            <div id="markdown-content"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script>
        // 配置 marked.js 以支持数学公式
        const renderer = {
            code(code, lang) {
                if (lang === 'math') {
                    return `<div class="math-block">${katex.renderToString(code, { displayMode: true, throwOnError: false })}</div>`;
                }
                // 默认的代码高亮
                const highlightedCode = hljs.highlightAuto(code).value;
                return `<pre><code>${highlightedCode}</code></pre>`;
            },
            codespan(code) {
                // 判断是否是行内数学公式
                if (code.startsWith('$') && code.endsWith('$')) {
                    const mathCode = code.slice(1, -1);
                    return katex.renderToString(mathCode, { throwOnError: false });
                }
                return `<code>${code}</code>`;
            }
        };

        marked.use({ renderer });

        // 获取 Markdown 文件并渲染
        fetch('README.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`无法找到文件：${response.statusText}`);
                }
                return response.text();
            })
            .then(markdownText => {
                // 使用 marked.js 将 Markdown 转换为 HTML
                const rawHtml = marked.parse(markdownText);

                // 使用 DOMPurify 净化 HTML，防止 XSS 攻击
                const cleanHtml = DOMPurify.sanitize(rawHtml);

                // 将生成的 HTML 插入到页面中
                const markdownDiv = document.getElementById('markdown-content');
                markdownDiv.innerHTML = cleanHtml;

                // 渲染 KaTeX 数学公式
                renderMathInElement(markdownDiv, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true }, // 块级公式
                        { left: '$', right: '$', display: false }    // 行内公式
                    ],
                    throwOnError: false
                });

                // 处理返回按钮的点击事件
                document.querySelector('.back-button').addEventListener('click', (e) => {
                    e.preventDefault();
                    history.back();
                });
            })
            .catch(error => {
                const markdownDiv = document.getElementById('markdown-content');
                markdownDiv.innerHTML = `<p style="color:red;">加载 README.md 文件失败：${error.message}</p>`;
                console.error('Error fetching Markdown:', error);
            });
    </script>
</body>
</html>
