<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Rhythm: Complete</title>
    <style>
        /* --- 字体与核心样式 --- */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --primary: #0ff;
            --secondary: #f0f;
            --bg-dark: #050505;
            --grid-color: rgba(0, 243, 255, 0.15);
            --font-main: 'Orbitron', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: #fff;
            touch-action: none; 
            user-select: none; -webkit-user-select: none;
        }

        /* --- 动态背景层 (回归) --- */
        #bgLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #000 0%, #1a0b2e 100%);
            z-index: 0; pointer-events: none;
            perspective: 800px; /* 3D透视 */
            overflow: hidden;
        }

        .grid-plane {
            position: absolute;
            width: 200%; height: 200%;
            left: -50%; top: -50%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg);
            animation: gridMove 2s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(50px); }
        }

        /* --- Canvas & UI --- */
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        #hud {
            position: absolute; top: max(15px, env(safe-area-inset-top));
            right: 20px; text-align: right;
        }
        .score-value { font-size: 28px; font-weight: 700; text-shadow: 0 0 10px var(--primary); }

        /* Combo 跳动效果 */
        .combo-box {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%) scale(0.8);
            text-align: center; opacity: 0;
            transition: transform 0.1s;
        }
        .combo-box.active { opacity: 1; transform: translateX(-50%) scale(1.2); }
        .combo-num {
            font-size: 56px; font-weight: 900;
            background: linear-gradient(180deg, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .combo-text { font-size: 14px; color: var(--secondary); font-weight: 700; letter-spacing: 4px; }

        /* 底部进度条 */
        #progressContainer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 6px;
            background: rgba(255,255,255,0.1); z-index: 20; pointer-events: none;
        }
        #progressBar {
            height: 100%; width: 0; background: var(--primary);
            box-shadow: 0 0 15px var(--primary); transition: width 0.1s linear;
        }

        /* --- 覆盖层 --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            opacity: 1; visibility: visible;
            transition: opacity 0.5s ease;
        }
        .overlay.hidden { 
            opacity: 0; visibility: hidden; 
            transition: opacity 0.5s ease, visibility 0s 0.5s; 
            pointer-events: none;
        }

        .btn-glitch {
            background: transparent; border: 2px solid var(--primary);
            color: var(--primary); padding: 15px 40px; font-size: 20px;
            font-family: var(--font-main); font-weight: 700;
            cursor: pointer; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            text-transform: uppercase; letter-spacing: 2px;
        }
        
        .result-panel {
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid var(--secondary);
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.2);
        }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .stat p { margin: 5px 0; font-weight: bold; font-size: 24px; }
        .stat span { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <!-- 1. 背景层 (回归) -->
    <div id="bgLayer">
        <div class="grid-plane"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div id="hud">
            <div class="score-value" id="scoreDisplay">000000</div>
        </div>
        <div class="combo-box" id="comboContainer">
            <div class="combo-num" id="comboNum">0</div>
            <div class="combo-text">COMBO</div>
        </div>
    </div>

    <div id="progressContainer"><div id="progressBar"></div></div>

    <div id="startScreen" class="overlay">
        <h1 style="font-size: 40px; margin-bottom: 40px; text-shadow: 4px 0 var(--secondary);">NEON RHYTHM</h1>
        <button id="startBtn" class="btn-glitch" disabled>LOADING...</button>
        <div style="margin-top: 20px; color: #888;" id="statusText">Wait...</div>
    </div>

    <div id="endScreen" class="overlay hidden">
        <div class="result-panel">
            <h1 style="font-size: 80px; margin:0; color: gold;" id="finalGrade">S</h1>
            <h2 id="finalScoreText">000000</h2>
            <div class="stats">
                <div class="stat"><span style="color:#0f0">PERFECT</span><p id="statPerfect">0</p></div>
                <div class="stat"><span style="color:#0ff">GOOD</span><p id="statGood">0</p></div>
                <div class="stat"><span style="color:#f05">MISS</span><p id="statMiss">0</p></div>
            </div>
            <button id="restartBtn" class="btn-glitch">RETRY</button>
        </div>
    </div>

    <script>
        // ================= 配置 =================
        const CONFIG = {
            musicUrl: 'audio.mp3', 
            hitSfxUrl: 'push.mp3', 
            imgUrl: 'source.jpeg',
            gameDuration: 180000, // 3分钟
            noteRadius: 55,        
            approachTime: 800, 
            perfectWin: 60,
            goodWin: 200,
        };

        // ⚠️ 请将你用工具生成的数组粘贴在下面覆盖这里
        const NOTE_TIMINGS = [1535,2037,2435,2908,3393,3854,4371,5027,5619,6095,6579,7055,7569,8083,8594,9084,9540,10042,10501,10994,11490,11935,12350,12791,13241,13711,14207,14689,15168,15603,16039,16491,16982,17458,17934,18413,19310,19719,20024,20300,20625,20970,21292,21629,21948,22265,22587,22903,23190,23513,23835,24169,24514,24851,25196,25539,25893,26264,26601,26920,27263,27585,27948,28279,28641,28929,29225,29524,29846,30203,30525,30882,31210,31550,31910,32287,32635,32981,33346,33744,34142,34501,34858,35140,35439,35761,36104,36507,36841,37169,37503,37845,38205,38565,38730,38899,39256,39621,39978,40327,40672,41000,41346,41697,42036,42396,42759,43093,43450,43772,44146,44489,44820,45180,45545,45882,46219,46561,46898,47240,47641,47969,48338,48692,49026,49394,49734,50079,50454,50805,51156,51475,51789,52143,52503,52871,53208,53556,53910,54238,54503,54694,55109,55423,55722,55965,56395,56752,57042,57245,57451,57898,58076,58406,58662,58824,59126,59477,59820,60154,60508,60868,61216,61582,61918,62261,62615,62966,63323,63680,64014,64371,64716,65065,65422,65750,66089,66478,66809,67175,67535,67883,68246,68609,68986,69352,69665,70028,70370,70707,71067,71418,71735,72106,72443,72780,73154,73523,73833,74170,74504,74823,75197,75560,75920,76271,76622,76985,77316,77656,77987,78312,78672,79061,79449,79806,80152,80497,80788,81098,81426,81800,82123,82459,82808,83208,83557,83916,84285,84668,84999,85350,85707,86073,86404,86778,87150,87498,87904,88279,88607,88949,89295,89669,90038,90459,90824,91190,91553,91919,92273,92656,92998,93338,93678,94005,94365,94676,95018,95381,95759,96107,96455,96803,97184,97558,97912,98281,98635,98928,99276,99633,99988,100324,100670,101021,101343,101674,102025,102353,102733,103087,103444,103790,104147,104483,104838,105177,105531,105888,106225,106588,106988,107331,107668,107984,108318,108657,109026,109368,109740,110088,110428,110750,111090,111452,111801,112149,112547,112979,113412,113690,113995,114163,114337,114535,114793,115170,115519,115919,116279,116645,117002,117408,117745,118169,118540,118929,119318,119646,119849,120050,120378,120845,121237,121431,121814,122180,122566,122946,123295,123623,123974,124371,124746,125112,125509,125843,126185,126513,126865,127196,127550,127880,128084,128426,128830,129294,129671,130017,130377,130731,131047,131387,131750,132133,132461,132786,133131,133479,133819,134179,134533,134887,135221,135566,135958,136301,136632,136983,137346,137679,137984,138344,138695,139041,139290,139476,139856,140425,140649,140834,140997,141336,141763,142158,142524,142872,143240,143551,143908,144262,144666,144991,145377,145737,146068,146349,146683,147072,147432,147780,148128,148503,148857,149202,149588,149960,150294,150645,150993,151321,151652,151980,152322,152659,153010,153370,153710,154061,154395,154737,155103,155451,155791,156128,156456,156795,157152,157486,157820,158145,158508,158841,159181,159532,159927,160284,160624,160989,161343,161683,162031,162368,162708,163053,163407,163761,164121,164498,164867,165192,165517,165874,166208,166579,166945,167322,167700,168071,168457,168901,169581];

        // ================= 音频系统 (Time Fix Version) =================
        const AudioSys = {
            ctx: null, bgmBuffer: null, sfxBuffer: null, bgmSource: null, 
            startTime: null, // 初始化为null，解决 0 判断 Bug
            fallbackStartTime: 0, usingFallback: false,

            async init() {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                document.getElementById('statusText').innerText = "Loading Audio...";
                try {
                    await Promise.all([
                        this.loadBuffer(CONFIG.musicUrl).then(b => this.bgmBuffer = b),
                        this.loadBuffer(CONFIG.hitSfxUrl).then(b => this.sfxBuffer = b)
                    ]);
                    document.getElementById('statusText').innerText = "READY // CLICK START";
                } catch (err) {
                    document.getElementById('statusText').innerText = "Error: " + err.message;
                }
            },

            async loadBuffer(url) {
                const res = await fetch(url);
                const buf = await res.arrayBuffer();
                return new Promise((resolve, reject) => {
                    this.ctx.decodeAudioData(buf, resolve, reject);
                });
            },

            async playBGM() {
                if (!this.bgmBuffer) return;
                if (this.ctx.state === 'suspended') await this.ctx.resume();
                if(this.bgmSource) try{this.bgmSource.stop()}catch(e){}
                
                this.bgmSource = this.ctx.createBufferSource();
                this.bgmSource.buffer = this.bgmBuffer;
                this.bgmSource.connect(this.ctx.destination);
                this.bgmSource.start(0);
                
                this.startTime = this.ctx.currentTime;
                
                // 备用方案：记录 performance.now()
                this.fallbackStartTime = performance.now();
                this.usingFallback = false;
            },
            
            playSFX() {
                if (!this.sfxBuffer) return;
                const src = this.ctx.createBufferSource();
                src.buffer = this.sfxBuffer;
                const gain = this.ctx.createGain();
                gain.gain.value = 0.6;
                src.connect(gain);
                gain.connect(this.ctx.destination);
                src.start(0);
            },

            getCurrentTime() {
                if (this.startTime === null) return 0; // 关键修复
                let time = (this.ctx.currentTime - this.startTime) * 1000;
                
                // 故障转移逻辑
                if (time <= 0 && (performance.now() - this.fallbackStartTime) > 100) {
                    this.usingFallback = true;
                }
                if (this.usingFallback) return performance.now() - this.fallbackStartTime;
                return Math.max(0, time);
            }
        };

        // ================= 游戏逻辑 =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const noteImage = new Image();
        noteImage.src = CONFIG.imgUrl;

        let gameState = {
            isPlaying: false, score: 0, combo: 0,
            perfect: 0, good: 0, miss: 0, maxScore: 1000000,
            balls: [], particles: []
        };
        
        // 判定文字动画状态 (回归)
        let feedback = { text: '', color: '', scale: 1, alpha: 0 };

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random()-0.5)*10; this.vy = (Math.random()-0.5)*10;
                this.life = 1.0;
            }
            update() { this.x+=this.vx; this.y+=this.vy; this.life-=0.05; return this.life>0; }
            draw(ctx) { 
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color; 
                ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill(); 
                ctx.globalAlpha=1; 
            }
        }

        class Ball {
            constructor(spawnTime) {
                this.spawnTime = spawnTime;
                this.appearTime = spawnTime - CONFIG.approachTime;
                this.x = 70 + Math.random()*(canvas.width-140);
                this.y = 120 + Math.random()*(canvas.height-200);
                this.r = CONFIG.noteRadius;
                this.state = 'active'; this.hitScale = 1; this.processed = false;
            }
            
            draw(ctx, now) {
                if (this.state === 'hit') {
                    this.hitScale += 0.2;
                    ctx.globalAlpha = Math.max(0, 1 - (this.hitScale-1)*2);
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.r*this.hitScale, 0, Math.PI*2);
                    ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1;
                    return this.hitScale < 2;
                }
                
                if (now < this.appearTime || this.state === 'miss') return false;
                const progress = (now - this.appearTime) / CONFIG.approachTime;
                
                ctx.save();
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.clip();
                if (noteImage.complete && noteImage.naturalWidth > 0) {
                    ctx.drawImage(noteImage, this.x-this.r, this.y-this.r, this.r*2, this.r*2);
                } else {
                    ctx.fillStyle = '#222'; ctx.fill(); ctx.strokeStyle = '#f00'; ctx.stroke();
                }
                ctx.restore();
                
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

                if (progress <= 1.1) {
                    const ringR = this.r + (100 * (1 - Math.min(progress, 1)));
                    ctx.beginPath(); ctx.arc(this.x, this.y, ringR, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(0,255,255,${Math.min(1, progress*2)})`;
                    ctx.lineWidth = 4; ctx.stroke();
                }
                return true;
            }
        }

        function initGame() {
            gameState.score = 0; gameState.combo = 0; 
            gameState.perfect = 0; gameState.good = 0; gameState.miss = 0;
            gameState.balls = NOTE_TIMINGS.map(t => new Ball(t));
            gameState.particles = [];
            document.getElementById('scoreDisplay').innerText = "000000";
        }

        function startGame() {
            if (gameState.isPlaying) return;
            initGame();
            gameState.isPlaying = true;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            AudioSys.playBGM();
            gameLoop();
        }

        function gameLoop() {
            if (!gameState.isPlaying) return;
            const now = AudioSys.getCurrentTime();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('progressBar').style.width = `${Math.min(now/CONFIG.gameDuration,1)*100}%`;

            if (now > CONFIG.gameDuration + 1500) { endGame(); return; }

            gameState.balls.forEach(ball => {
                if(ball.processed) { ball.draw(ctx, now); return; }
                if (now > ball.spawnTime + CONFIG.goodWin) {
                    ball.state = 'miss'; ball.processed = true;
                    gameState.miss++;
                    gameState.combo = 0; showFeedback('MISS', '#ff0055'); updateUI();
                } else {
                    ball.draw(ctx, now);
                }
            });

            for(let i=gameState.particles.length-1; i>=0; i--) {
                if(gameState.particles[i].update()) gameState.particles[i].draw(ctx);
                else gameState.particles.splice(i,1);
            }
            
            // 绘制判定反馈 (回归)
            drawFeedback(ctx);
            
            requestAnimationFrame(gameLoop);
        }

        function handleInput(x, y) {
            const now = AudioSys.getCurrentTime();
            const balls = gameState.balls.filter(b => !b.processed && Math.abs(now - b.spawnTime) < CONFIG.goodWin);
            
            for (let b of balls) {
                if (Math.hypot(x-b.x, y-b.y) < b.r * 1.5) {
                    b.state = 'hit'; b.processed = true;
                    
                    const diff = Math.abs(now - b.spawnTime);
                    let text = 'GOOD', color = '#00f3ff', score = 50;
                    
                    if(diff <= CONFIG.perfectWin) { 
                        text = 'PERFECT'; color = '#00ff00'; score = 100; 
                        gameState.perfect++;
                    } else {
                        gameState.good++;
                    }

                    gameState.score += score * 10; // 简单分数逻辑
                    gameState.combo++;
                    
                    AudioSys.playSFX();
                    showFeedback(text, color);
                    updateUI();
                    
                    for(let i=0;i<10;i++) gameState.particles.push(new Particle(b.x, b.y, color));
                    return;
                }
            }
        }

        // --- 反馈系统 (回归) ---
        function showFeedback(text, color) {
            feedback = { text, color, scale: 0.5, alpha: 1 };
            const comboEl = document.getElementById('comboContainer');
            document.getElementById('comboNum').innerText = gameState.combo;
            
            if (gameState.combo > 1 && text !== 'MISS') {
                comboEl.classList.add('active');
                comboEl.style.transform = 'translateX(-50%) scale(1.3)';
                setTimeout(() => comboEl.style.transform = 'translateX(-50%) scale(1)', 50);
            } else {
                comboEl.classList.remove('active');
            }
        }

        function drawFeedback(ctx) {
            if (feedback.alpha <= 0.01) return;
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            
            feedback.scale += (1.2 - feedback.scale) * 0.2;
            feedback.alpha *= 0.92;

            ctx.scale(feedback.scale, feedback.scale);
            ctx.globalAlpha = feedback.alpha;
            
            ctx.font = '900 50px "Orbitron"';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = feedback.color;
            ctx.shadowColor = feedback.color; ctx.shadowBlur = 20;
            ctx.fillText(feedback.text, 0, 0);
            ctx.lineWidth = 2; ctx.strokeStyle = '#fff';
            ctx.strokeText(feedback.text, 0, 0);
            ctx.restore();
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = gameState.score.toString().padStart(6,'0');
        }

        function endGame() {
            gameState.isPlaying = false;
            // 计算评级
            const total = gameState.perfect + gameState.good + gameState.miss;
            const ratio = (gameState.perfect + gameState.good * 0.5) / total; // 简单计算
            let rank = 'D';
            if(ratio > 0.95) rank = 'S';
            else if(ratio > 0.9) rank = 'A';
            else if(ratio > 0.8) rank = 'B';
            else if(ratio > 0.7) rank = 'C';

            document.getElementById('finalGrade').innerText = rank;
            document.getElementById('finalScoreText').innerText = gameState.score.toString().padStart(6,'0');
            document.getElementById('statPerfect').innerText = gameState.perfect;
            document.getElementById('statGood').innerText = gameState.good;
            document.getElementById('statMiss').innerText = gameState.miss;
            
            document.getElementById('endScreen').classList.remove('hidden');
        }

        // ================= 事件 =================
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) handleInput(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        }, {passive:false});
        
        canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));

        const btn = document.getElementById('startBtn');
        window.onload = async () => {
            await AudioSys.init();
            if(AudioSys.bgmBuffer) {
                btn.removeAttribute('disabled');
                btn.innerText = "START GAME";
            }
        };

        btn.addEventListener('click', async () => {
            if(AudioSys.ctx.state === 'suspended') await AudioSys.ctx.resume();
            startGame();
        });
        
        document.getElementById('restartBtn').onclick = () => {
             document.getElementById('endScreen').classList.add('hidden');
             setTimeout(startGame, 100);
        };
    </script>
</body>
</html>
