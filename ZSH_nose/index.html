<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Rhythm: Overdrive</title>
    <style>
        /* --- 字体与核心样式 --- */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --primary: #0ff;
            --secondary: #f0f;
            --bg-dark: #050505;
            --grid-color: rgba(0, 243, 255, 0.15);
            --font-main: 'Orbitron', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: #fff;
            touch-action: none; /* 禁止移动端默认手势 */
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- 动态背景层 --- */
        #bgLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #000 0%, #1a0b2e 100%);
            z-index: 0;
            perspective: 800px;
            overflow: hidden;
            pointer-events: none;
        }

        .grid-plane {
            position: absolute;
            width: 200%;
            height: 200%;
            left: -50%;
            top: -50%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg);
            animation: gridMove 2s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(50px); }
        }

        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 5;
        }

        /* --- UI 层 --- */
        #uiLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-box {
            text-align: right;
            text-shadow: 0 0 10px var(--primary);
        }
        .score-label { font-size: 10px; color: #888; letter-spacing: 2px; }
        .score-value { font-size: 28px; font-weight: 700; letter-spacing: 1px; }

        /* 系统状态指示器 */
        .system-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 10px;
            color: var(--primary);
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .beat-dot {
            width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
            box-shadow: 0 0 5px var(--primary);
        }

        .combo-box {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            text-align: center;
            opacity: 0;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .combo-box.active { opacity: 1; transform: translateX(-50%) scale(1.2); }
        .combo-num {
            font-size: 56px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(180deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
        }
        .combo-text { font-size: 14px; color: var(--secondary); font-weight: 700; letter-spacing: 4px; }

        /* 底部进度条 */
        #progressContainer {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 6px;
            background: rgba(255,255,255,0.1);
            z-index: 20;
            pointer-events: none;
        }
        #progressBar {
            height: 100%; width: 0;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transition: width 0.1s linear;
        }

        /* --- 覆盖层 (开始/结算) --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease;
        }

        /* 关键修复：延迟隐藏 visibility 以防止幽灵点击 */
        .overlay.hidden { 
            opacity: 0; 
            visibility: hidden; 
            transition: opacity 0.5s ease, visibility 0s 0.5s; 
            pointer-events: none;
        }

        .btn-glitch {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 40px;
            font-size: 20px;
            font-family: var(--font-main);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            /* pointer-events: auto; <--- 已删除，防止误触 */
        }
        .btn-glitch:hover, .btn-glitch:active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
        }
        .loading-text { margin-top: 20px; font-size: 12px; color: #888; }

        .result-panel {
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid var(--secondary);
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.2);
            transform: translateY(20px);
            transition: 0.5s;
        }
        .grade { font-size: 100px; font-weight: 900; margin: 0; color: #ffd700; text-shadow: 0 0 20px gold; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .stat p { margin: 5px 0; font-weight: bold; }
        .stat span { font-size: 12px; color: #aaa; }

    </style>
</head>
<body>
    <div id="bgLayer">
        <div class="grid-plane"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div id="hud">
            <div class="score-box">
                <div class="score-value" id="scoreDisplay">000000</div>
                <div class="score-label">SCORE</div>
            </div>
        </div>
        
        <div class="combo-box" id="comboContainer">
            <div class="combo-num" id="comboNum">0</div>
            <div class="combo-text">COMBO</div>
        </div>

        <div class="system-status">
            <div class="beat-dot" id="beatDot"></div>
            <span id="systemText">SYSTEM ONLINE</span>
        </div>
    </div>

    <div id="progressContainer"><div id="progressBar"></div></div>

    <div id="startScreen" class="overlay">
        <h1 style="font-size: 40px; margin-bottom: 40px; text-shadow: 4px 0 var(--secondary);">NEON RHYTHM</h1>
        <button id="startBtn" class="btn-glitch" disabled>LOADING...</button>
        <div class="loading-text" id="statusText">正在预加载音频资源...</div>
    </div>

    <div id="endScreen" class="overlay hidden">
        <div class="result-panel">
            <h1 class="grade" id="finalGrade">S</h1>
            <h2 id="finalScoreText">000000</h2>
            <div class="stats">
                <div class="stat"><span style="color:#0f0">PERFECT</span><p id="statPerfect">0</p></div>
                <div class="stat"><span style="color:#0ff">GOOD</span><p id="statGood">0</p></div>
                <div class="stat"><span style="color:#f05">MISS</span><p id="statMiss">0</p></div>
            </div>
            <button id="restartBtn" class="btn-glitch">RETRY</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 核心配置 (已改为 MP3)
        // ==========================================
        const CONFIG = {
            musicUrl: 'audio.mp3', // 确保文件是 mp3 格式
            hitSfxUrl: 'push.mp3', // 确保文件是 mp3 格式
            imgUrl: 'source.jpeg',
            gameDuration: 88000,
            noteRadius: 55,        
            approachTime: 800,
            perfectWin: 60,
            goodWin: 200,
        };

        // 谱面数据 (含 1500ms 开场热身)
        const NOTE_TIMINGS = [1535,2037,2435,2908,3393,3854,4371,5027,5619,6095,6579,7055,7569,8083,8594,9084,9540,10042,10501,10994,11490,11935,12350,12791,13241,13711,14207,14689,15168,15603,16039,16491,16982,17458,17934,18413,19310,19719,20024,20300,20625,20970,21292,21629,21948,22265,22587,22903,23190,23513,23835,24169,24514,24851,25196,25539,25893,26264,26601,26920,27263,27585,27948,28279,28641,28929,29225,29524,29846,30203,30525,30882,31210,31550,31910,32287,32635,32981,33346,33744,34142,34501,34858,35140,35439,35761,36104,36507,36841,37169,37503,37845,38205,38565,38730,38899,39256,39621,39978,40327,40672,41000,41346,41697,42036,42396,42759,43093,43450,43772,44146,44489,44820,45180,45545,45882,46219,46561,46898,47240,47641,47969,48338,48692,49026,49394,49734,50079,50454,50805,51156,51475,51789,52143,52503,52871,53208,53556,53910,54238,54503,54694,55109,55423,55722,55965,56395,56752,57042,57245,57451,57898,58076,58406,58662,58824,59126,59477,59820,60154,60508,60868,61216,61582,61918,62261,62615,62966,63323,63680,64014,64371,64716,65065,65422,65750,66089,66478,66809,67175,67535,67883,68246,68609,68986,69352,69665,70028,70370,70707,71067,71418,71735,72106,72443,72780,73154,73523,73833,74170,74504,74823,75197,75560,75920,76271,76622,76985,77316,77656,77987,78312,78672,79061,79449,79806,80152,80497,80788,81098,81426,81800,82123,82459,82808,83208,83557,83916,84285,84668,84999,85350,85707,86073,86404,86778,87150,87498,87904,88279,88607,88949,89295,89669,90038,90459,90824,91190,91553,91919,92273,92656,92998,93338,93678,94005,94365,94676,95018,95381,95759,96107,96455,96803,97184,97558,97912,98281,98635,98928,99276,99633,99988,100324,100670,101021,101343,101674,102025,102353,102733,103087,103444,103790,104147,104483,104838,105177,105531,105888,106225,106588,106988,107331,107668,107984,108318,108657,109026,109368,109740,110088,110428,110750,111090,111452,111801,112149,112547,112979,113412,113690,113995,114163,114337,114535,114793,115170,115519,115919,116279,116645,117002,117408,117745,118169,118540,118929,119318,119646,119849,120050,120378,120845,121237,121431,121814,122180,122566,122946,123295,123623,123974,124371,124746,125112,125509,125843,126185,126513,126865,127196,127550,127880,128084,128426,128830,129294,129671,130017,130377,130731,131047,131387,131750,132133,132461,132786,133131,133479,133819,134179,134533,134887,135221,135566,135958,136301,136632,136983,137346,137679,137984,138344,138695,139041,139290,139476,139856,140425,140649,140834,140997,141336,141763,142158,142524,142872,143240,143551,143908,144262,144666,144991,145377,145737,146068,146349,146683,147072,147432,147780,148128,148503,148857,149202,149588,149960,150294,150645,150993,151321,151652,151980,152322,152659,153010,153370,153710,154061,154395,154737,155103,155451,155791,156128,156456,156795,157152,157486,157820,158145,158508,158841,159181,159532,159927,160284,160624,160989,161343,161683,162031,162368,162708,163053,163407,163761,164121,164498,164867,165192,165517,165874,166208,166579,166945,167322,167700,168071,168457,168901,169581];
        // ==========================================
        // 音频系统 (修复 iOS 兼容性版)
        // ==========================================
        const AudioSys = {
            ctx: null,
            bgmBuffer: null,
            sfxBuffer: null,
            bgmSource: null,
            startTime: 0,
            
            async init() {
                // 1. 兼容性创建 AudioContext
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                document.getElementById('statusText').innerText = "正在下载音频...";

                // 2. 并行加载
                try {
                    await Promise.all([
                        this.loadBuffer(CONFIG.musicUrl).then(b => this.bgmBuffer = b),
                        this.loadBuffer(CONFIG.hitSfxUrl).then(b => this.sfxBuffer = b)
                    ]);
                } catch (err) {
                    console.error(err);
                    document.getElementById('statusText').innerText = "加载失败: " + err.message;
                    document.getElementById('statusText').style.color = "#ff0055";
                    return;
                }
            },

            // 核心修复：兼容 Callback 和 Promise 的解码函数
            async loadBuffer(url) {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();

                return new Promise((resolve, reject) => {
                    // 尝试旧式回调 (Safari/Webkit)
                    const res = this.ctx.decodeAudioData(arrayBuffer, 
                        (decodedData) => resolve(decodedData),
                        (err) => reject(err)
                    );
                    // 尝试新式 Promise (Chrome/Firefox)
                    if (res && typeof res.then === 'function') {
                        res.then(resolve).catch(reject);
                    }
                });
            },

            playBGM() {
                if (!this.bgmBuffer) return;
                this.stopBGM();
                
                this.bgmSource = this.ctx.createBufferSource();
                this.bgmSource.buffer = this.bgmBuffer;
                this.bgmSource.connect(this.ctx.destination);
                
                this.bgmSource.start(0);
                this.startTime = this.ctx.currentTime;
            },

            stopBGM() {
                if (this.bgmSource) {
                    try { this.bgmSource.stop(); } catch(e){}
                    this.bgmSource = null;
                }
            },

            playSFX() {
                if (!this.sfxBuffer) return;
                const source = this.ctx.createBufferSource();
                source.buffer = this.sfxBuffer;
                const gain = this.ctx.createGain();
                gain.gain.value = 0.6; 
                source.connect(gain);
                gain.connect(this.ctx.destination);
                source.start(0);
            },

            getCurrentTime() {
                if (!this.startTime) return 0;
                return (this.ctx.currentTime - this.startTime) * 1000;
            }
        };

        // ==========================================
        // 游戏逻辑
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = {
            isPlaying: false,
            score: 0,
            combo: 0,
            perfect: 0, good: 0, miss: 0,
            maxScore: 1000000,
            balls: [],
            particles: []
        };

        const noteImage = new Image();
        noteImage.src = CONFIG.imgUrl;

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.life -= this.decay;
                return this.life > 0;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Ball {
            constructor(spawnTime) {
                this.spawnTime = spawnTime;
                this.appearTime = spawnTime - CONFIG.approachTime;
                
                const margin = 70;
                this.x = margin + Math.random() * (canvas.width - margin*2);
                this.y = 120 + Math.random() * (canvas.height - 150 - margin);
                
                this.r = CONFIG.noteRadius;
                this.state = 'active'; 
                this.hitAnimScale = 1;
                this.processed = false;
            }

            draw(ctx, currentTime) {
                if (this.state === 'hit') {
                    this.hitAnimScale += 0.15;
                    const alpha = Math.max(0, 1 - (this.hitAnimScale - 1) * 2);
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r * this.hitAnimScale, 0, Math.PI*2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    return this.hitAnimScale < 2.0; 
                }

                if (currentTime < this.appearTime || this.state === 'miss') return false;

                const progress = (currentTime - this.appearTime) / CONFIG.approachTime;
                
                // 本体
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                ctx.clip();
                if (noteImage.complete) {
                    ctx.drawImage(noteImage, this.x-this.r, this.y-this.r, this.r*2, this.r*2);
                } else {
                    ctx.fillStyle = '#333'; ctx.fill();
                }
                
                // 高光
                const grad = ctx.createRadialGradient(this.x, this.y, this.r*0.2, this.x, this.y, this.r);
                grad.addColorStop(0, 'rgba(255,255,255,0.2)');
                grad.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = grad; ctx.fill();
                
                // 边框
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();

                // 缩圈
                if (progress <= 1.05) { 
                    const ringR = this.r + (100 * (1 - Math.min(progress, 1)));
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, ringR, 0, Math.PI*2);
                    const alpha = Math.min(progress * 2, 1);
                    ctx.strokeStyle = `rgba(0, 243, 255, ${alpha})`;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
                return true;
            }
        }

        // --- 主控逻辑 ---

        function initGame() {
            gameState.score = 0;
            gameState.combo = 0;
            gameState.perfect = 0; 
            gameState.good = 0; 
            gameState.miss = 0;
            gameState.particles = [];
            
            gameState.balls = NOTE_TIMINGS
                .filter(t => t < CONFIG.gameDuration)
                .map(t => new Ball(t));
                
            updateUI();
        }

        function startGame() {
            if (gameState.isPlaying) return; 

            initGame();
            gameState.isPlaying = true;
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('systemText').innerText = "AUDIO SYNCED";
            
            AudioSys.playBGM();
            gameLoop();
        }

        function gameLoop() {
            if (!gameState.isPlaying) return;

            const now = AudioSys.getCurrentTime();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 进度条与心跳
            const safeNow = Math.max(0, now);
            const prog = Math.min(safeNow / CONFIG.gameDuration, 1);
            document.getElementById('progressBar').style.width = `${prog * 100}%`;

            const beat = Math.sin(now / 200) * 0.5 + 0.5;
            document.getElementById('beatDot').style.opacity = beat;

            if (now > CONFIG.gameDuration + 1500) {
                endGame();
                return;
            }

            gameState.balls.forEach(ball => {
                if (ball.processed) {
                    ball.draw(ctx, now); 
                    return;
                }
                if (now > ball.spawnTime + CONFIG.goodWin) {
                    triggerMiss(ball);
                } else {
                    ball.draw(ctx, now);
                }
            });

            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                if (!gameState.particles[i].update()) {
                    gameState.particles.splice(i, 1);
                } else {
                    gameState.particles[i].draw(ctx);
                }
            }

            drawFeedback(ctx);
            requestAnimationFrame(gameLoop);
        }

        function handleInput(x, y) {
            const now = AudioSys.getCurrentTime();
            
            let candidates = gameState.balls.filter(b => 
                !b.processed && 
                Math.abs(now - b.spawnTime) <= CONFIG.goodWin
            );

            let hitBall = null;
            for (let ball of candidates) {
                const dist = Math.sqrt((x - ball.x)**2 + (y - ball.y)**2);
                if (dist < ball.r * 1.4) { 
                    hitBall = ball;
                    break; 
                }
            }

            if (hitBall) {
                const diff = Math.abs(now - hitBall.spawnTime);
                let score = 0, text = '', color = '';

                if (diff <= CONFIG.perfectWin) {
                    score = 100; text = 'PERFECT'; color = '#00ff00';
                    gameState.perfect++;
                } else {
                    score = 50; text = 'GOOD'; color = '#00f3ff';
                    gameState.good++;
                }

                hitBall.state = 'hit';
                hitBall.processed = true;
                
                AudioSys.playSFX();
                spawnParticles(hitBall.x, hitBall.y, color);
                
                gameState.combo++;
                const baseScore = gameState.maxScore / gameState.balls.length;
                gameState.score += (score === 100 ? baseScore : baseScore * 0.6);
                
                showFeedback(text, color);
                updateUI();
            }
        }

        function triggerMiss(ball) {
            ball.state = 'miss';
            ball.processed = true;
            gameState.miss++;
            gameState.combo = 0;
            showFeedback('MISS', '#ff0055');
            updateUI();
        }

        // --- UI & FX ---

        function spawnParticles(x, y, color) {
            for(let i=0; i<12; i++) {
                gameState.particles.push(new Particle(x, y, color));
            }
        }

        let feedbackData = { text: '', color: '', scale: 1, alpha: 0 };
        function showFeedback(text, color) {
            feedbackData = { text, color, scale: 0.5, alpha: 1 };
            const comboEl = document.getElementById('comboContainer');
            if (gameState.combo > 1 && text !== 'MISS') {
                comboEl.classList.add('active');
                comboEl.style.transform = 'translateX(-50%) scale(1.3)';
                setTimeout(() => comboEl.style.transform = 'translateX(-50%) scale(1)', 50);
            } else {
                comboEl.classList.remove('active');
            }
        }

        function drawFeedback(ctx) {
            if (feedbackData.alpha <= 0.01) return;
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            feedbackData.scale += (1.2 - feedbackData.scale) * 0.2;
            feedbackData.alpha *= 0.92;
            ctx.scale(feedbackData.scale, feedbackData.scale);
            ctx.globalAlpha = feedbackData.alpha;
            ctx.font = '900 50px "Orbitron"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = feedbackData.color;
            ctx.shadowColor = feedbackData.color;
            ctx.shadowBlur = 20;
            ctx.fillText(feedbackData.text, 0, 0);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.strokeText(feedbackData.text, 0, 0);
            ctx.restore();
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = Math.floor(gameState.score).toString().padStart(6, '0');
            document.getElementById('comboNum').innerText = gameState.combo;
        }

        function endGame() {
            gameState.isPlaying = false;
            const ratio = gameState.score / gameState.maxScore;
            let rank = 'D';
            if (ratio > 0.95) rank = 'S';
            else if (ratio > 0.9) rank = 'A';
            else if (ratio > 0.8) rank = 'B';
            else if (ratio > 0.7) rank = 'C';

            document.getElementById('finalGrade').innerText = rank;
            document.getElementById('finalScoreText').innerText = Math.floor(gameState.score).toString().padStart(6, '0');
            document.getElementById('statPerfect').innerText = gameState.perfect;
            document.getElementById('statGood').innerText = gameState.good;
            document.getElementById('statMiss').innerText = gameState.miss;
            
            document.getElementById('endScreen').classList.remove('hidden');
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // --- 事件监听 ---
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                handleInput(t.clientX, t.clientY);
            }
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const statusText = document.getElementById('statusText');

        window.onload = async () => {
            resize();
            window.addEventListener('resize', resize);
            await AudioSys.init();
            
            if (AudioSys.bgmBuffer) {
                startBtn.removeAttribute('disabled');
                startBtn.innerText = "START GAME";
                statusText.innerText = "READY // AUDIO LOADED";
            }
        };

        // 关键：等待音频引擎 Resumed
        startBtn.addEventListener('click', async () => {
            startBtn.innerText = "STARTING...";
            if (AudioSys.ctx.state === 'suspended') {
                await AudioSys.ctx.resume();
            }
            startGame();
        });

        restartBtn.addEventListener('click', () => {
            document.getElementById('endScreen').classList.add('hidden');
            setTimeout(() => startGame(), 100);
        });
    </script>
</body>
</html>
