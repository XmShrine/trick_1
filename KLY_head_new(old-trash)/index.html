<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>摸一摸金源 · 重制版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030a; touch-action: manipulation; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; color: #f6e7c1; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom)); }
  .title { font-size: clamp(28px, 6vw, 52px); font-weight: 800; letter-spacing: 0.12em; text-align: center;
    background: linear-gradient(180deg, #fff6d8 0%, #f3c45a 55%, #b5761d 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 190, 80, 0.45)); }

  .btn { pointer-events: auto; border: none; cursor: pointer; font-size: clamp(20px, 5vw, 26px); font-weight: 700; letter-spacing: 0.15em; color: #2a1404;
    padding: 16px 52px; border-radius: 999px; background: linear-gradient(180deg, #fff2c4 0%, #f5c04f 50%, #d98a1c 100%);
    box-shadow: 0 0 0 2px rgba(255, 230, 160, 0.5), 0 0 28px rgba(255, 170, 60, 0.55), inset 0 -3px 0 rgba(120, 50, 0, 0.35);
    transition: transform 0.08s ease, filter 0.2s ease; touch-action: manipulation; }

<div id="stage"></div>

<div class="hud">
  <div style="display:flex;flex-direction:column;align-items:center">
    <h1 class="title">摸一摸金源</h1>
    <div class="meter"><span class="num" id="count">0</span> / 57<div class="bar"><i id="barFill"></i></div></div>
  </div>
  <button class="btn" id="touchBtn">😋摸😋</button>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const MAX = 57;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
const Q = isMobile ? 0.6 : 1; // 粒子数量系数

// ---------- 渲染器与场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
const lookTarget = new THREE.Vector3(0, 0.3, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// 亮度上限：粒子叠加再多，单个像素也不超过这个值，辉光就不会淹没整屏
const clampPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, maxV: { value: 2.5 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float maxV; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); float m = max(c.r, max(c.g, c.b));
      gl_FragColor = vec4(m > maxV ? c.rgb * (maxV / m) : c.rgb, c.a); }`
});
composer.addPass(clampPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight).multiplyScalar(isMobile ? 0.5 : 1), 0.6, 0.55, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- 通用工具 ----------
function R0(a, b) { return a + Math.random() * (b - a); }
const FLOOR_Y = -3.2, GROUND_Y = -3.65;
const NOISE_GLSL = `
  float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float vnoise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; } return s; }`;

// 程序生成的石材贴图（tiles > 0 时画成石板地砖）
function stoneTexture(size, base, tiles) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  for (let i = 0; i < size * size / 220; i++) {
    const r = R0(2, size * 0.05), v = Math.random() < 0.5 ? 255 : 0;
    g.fillStyle = `rgba(${v},${v},${v},${R0(0.01, 0.05)})`;
    g.beginPath(); g.arc(R0(0, size), R0(0, size), r, 0, 7); g.fill();
  }
  for (let i = 0; i < 7; i++) { // 大理石纹
    g.strokeStyle = `rgba(255,250,240,${R0(0.04, 0.1)})`; g.lineWidth = R0(0.5, 2);
    g.beginPath(); g.moveTo(R0(0, size), 0);
    g.bezierCurveTo(R0(0, size), size * 0.33, R0(0, size), size * 0.66, R0(0, size), size); g.stroke();
  }
  for (let i = 0; i < size * size / 40; i++) { // 细小颗粒
    const v = Math.random() < 0.5 ? 255 : 0;
    g.fillStyle = `rgba(${v},${v},${v},${R0(0.03, 0.12)})`; g.fillRect(R0(0, size), R0(0, size), 1, 1);
  }
  if (tiles) {
    const s = size / tiles;
    for (let y = 0; y < tiles; y++) for (let x = 0; x < tiles; x++) {
      const off = (y % 2) * s / 2;
      g.fillStyle = `rgba(${Math.random() < 0.5 ? 255 : 0},0,0,0)`;
      const v = Math.random() < 0.5 ? 255 : 0;
      g.fillStyle = `rgba(${v},${v},${v},${R0(0.02, 0.08)})`; g.fillRect(x * s + off, y * s, s, s);
      g.strokeStyle = 'rgba(10,6,4,0.55)'; g.lineWidth = 3; g.strokeRect(x * s + off, y * s, s, s);
      g.strokeRect(x * s + off - size, y * s, s, s);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const marbleTex = stoneTexture(512, '#a89c8c', 0);
const tileTex = stoneTexture(1024, '#7d7266', 8); tileTex.repeat.set(3, 3);
const rockTex = stoneTexture(512, '#3a3038', 0); rockTex.repeat.set(30, 30);
const marbleMat = new THREE.MeshStandardMaterial({ map: marbleTex, bumpMap: marbleTex, bumpScale: 0.6, roughness: 0.7, metalness: 0.05 });
const stoneMat = marbleMat;
const darkStoneMat = new THREE.MeshStandardMaterial({ map: marbleTex, bumpMap: marbleTex, bumpScale: 0.8, color: 0x8a7f80, roughness: 0.85 });
const addGlow = (color, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

// ---------- 天空：分层星云 + 地平线辉光 ----------
const nebulaMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { time: { value: 0 }, heat: { value: 0 }, flash: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: NOISE_GLSL + `
    varying vec3 vDir; uniform float time; uniform float heat; uniform float flash;
    void main(){
      vec3 d = normalize(vDir);
      vec3 q = d * 2.6 + vec3(time * 0.006, 0.0, time * 0.004);
      float warp = fbm(q * 1.7 + 4.0);
      float n = fbm(q + warp * 1.6);
      float n2 = fbm(q * 0.7 - 7.0 + warp);
      vec3 zenith  = mix(vec3(0.008, 0.008, 0.03), vec3(0.09, 0.01, 0.0), heat);
      vec3 horizon = mix(vec3(0.17, 0.09, 0.24), vec3(0.95, 0.32, 0.08), heat);
      vec3 col = mix(horizon, zenith, smoothstep(-0.02, 0.55, d.y));
      float band = exp(-pow((d.y - 0.32 - 0.28 * d.x) * 2.0, 2.0));            // 斜贯天空的银河带
      vec3 neb1 = mix(vec3(0.42, 0.14, 0.62), vec3(1.0, 0.38, 0.1), heat);
      vec3 neb2 = mix(vec3(0.06, 0.28, 0.55), vec3(0.7, 0.14, 0.03), heat);
      col += neb1 * pow(n, 3.0) * 2.2 * band;
      col += neb2 * pow(n2, 4.0) * 1.6 * (0.4 + band);
      col -= vec3(0.06) * smoothstep(0.55, 0.75, fbm(q * 3.0 + 11.0)) * band;  // 暗尘带
      col += horizon * exp(-abs(d.y) * 14.0) * 0.7;
      col += vec3(1.0, 0.6, 0.3) * flash;
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 64, 40), nebulaMat));

{ // 星星：大小、亮度不一
  const n = Math.floor(3500 * Q), p = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection(); v.y = Math.abs(v.y) * 0.95 + 0.02; v.normalize().multiplyScalar(150 + Math.random() * 30);
    p.set([v.x, v.y, v.z], i * 3);
    const b = Math.pow(Math.random(), 3) * 1.6 + 0.25, tint = Math.random();
    col.set([b * (0.85 + tint * 0.15), b * 0.9, b * (1.05 - tint * 0.2)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.55, sizeAttenuation: true, vertexColors: true, transparent: true, depthWrite: false, fog: false }));
  scene.add(stars);
}

// 巨大的月亮
const moonMat = new THREE.ShaderMaterial({
  uniforms: { heat: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normal); vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: NOISE_GLSL + `
    varying vec3 vN; varying vec3 vP; uniform float heat;
    void main(){
      vec3 L = normalize(vec3(0.9, 0.25, 0.7));
      float diff = smoothstep(-0.05, 0.6, dot(vN, L));
      float surf = 0.55 + 0.45 * fbm(vN * 3.5);
      surf -= 0.25 * smoothstep(0.62, 0.7, fbm(vN * 7.0 + 3.0));   // 环形山
      vec3 base = mix(vec3(0.9, 0.86, 1.0), vec3(1.0, 0.55, 0.35), heat);
      vec3 col = base * surf * diff * 1.1;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const moon = new THREE.Mesh(new THREE.SphereGeometry(16, 64, 48), moonMat);
moon.position.set(-75, 62, -140); moon.lookAt(0, 0, 0);
scene.add(moon);
const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTexture([[0, 'rgba(255,255,255,0.6)'], [0.22, 'rgba(255,255,255,0.35)'], [0.5, 'rgba(255,255,255,0.08)'], [1, 'rgba(255,255,255,0)']]), color: 0x8070c0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.55 }));
moonHalo.position.copy(moon.position).multiplyScalar(1.01); moonHalo.scale.setScalar(80);
scene.add(moonHalo);

// 远山：两层剪影，越远越淡
function mountainRing(radius, hMin, hMax, top, bottom, seed) {
  const N = 480, pos = [], col = [], idx = [];
  const ct = new THREE.Color(top), cb = new THREE.Color(bottom);
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    let h = 0, amp = 1, f = 3;
    for (let o = 0; o < 6; o++) { h += amp * (1 - Math.abs(Math.sin(a * f + seed * (o + 1) * 1.7))); amp *= 0.5; f *= 2.1; }
    h = hMin + (hMax - hMin) * Math.pow(h / 1.9, 2.2);
    const x = Math.cos(a) * radius, z = Math.sin(a) * radius;
    pos.push(x, GROUND_Y - 1, z, x, h, z);
    col.push(cb.r, cb.g, cb.b, ct.r, ct.g, ct.b);
    if (i < N) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog: false }));
  scene.add(m); return m;
}
const farMountains = mountainRing(175, 4, 52, 0x2a1a3a, 0x140c1e, 1.3);
const nearMountains = mountainRing(130, 0, 30, 0x150d1e, 0x07040b, 4.1);

// 起伏的大地
function terrainY(x, z) {
  const r = Math.hypot(x, z);
  const hill = Math.sin(x * 0.07) * Math.cos(z * 0.05) * 3 + Math.sin(x * 0.19 + z * 0.13) * 1.2 + Math.sin(z * 0.3 - x * 0.1) * 0.4;
  return GROUND_Y + hill * THREE.MathUtils.smoothstep(r, 22, 70);
}
{
  const g = new THREE.PlaneGeometry(320, 320, 160, 160); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainY(p.getX(i), p.getZ(i)) + Math.random() * 0.12);
  g.computeVertexNormals();
  var ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: rockTex, bumpMap: rockTex, bumpScale: 1, color: 0x6a5a66, roughness: 1 }));
  scene.add(ground);
}
scene.fog = new THREE.FogExp2(0x120a1c, 0.009);

// ---------- 灯光 ----------
scene.add(new THREE.HemisphereLight(0x6a5aa0, 0x1a0a05, 0.7));
const moonLight = new THREE.DirectionalLight(0x9aa0ff, 1.1);
moonLight.position.set(-75, 62, -140); scene.add(moonLight);
const headLight = new THREE.PointLight(0xffc070, 40, 40, 1.6);
headLight.position.set(0, 0.5, 2);
scene.add(headLight);

// ---------- 神殿 ----------
// 三层台阶 + 石砖地面
[[15.2, GROUND_Y, -3.5], [14.2, -3.5, -3.35], [13.2, -3.35, FLOOR_Y]].forEach(([r, y0, y1]) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.15, y1 - y0, 96), darkStoneMat);
  m.position.y = (y0 + y1) / 2; scene.add(m);
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(13.15, 96), new THREE.MeshStandardMaterial({ map: tileTex, bumpMap: tileTex, bumpScale: 1.2, roughness: 0.55, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y + 0.005; scene.add(floor);

// 中央祭坛
const platform = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.4, 0.42, 96), marbleMat);
platform.position.y = -3.0; scene.add(platform);
const platformTrim = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.08, 8, 128), marbleMat);
platformTrim.rotation.x = Math.PI / 2; platformTrim.position.y = -3.16; scene.add(platformTrim);
const floorRingMat = addGlow(0xffb54a, 2.2);
const floorRing = new THREE.Mesh(new THREE.RingGeometry(3.55, 3.7, 128), floorRingMat);
floorRing.rotation.x = -Math.PI / 2; floorRing.position.y = -2.785; scene.add(floorRing);
const floorRing2 = new THREE.Mesh(new THREE.RingGeometry(2.6, 2.64, 128), floorRingMat);
floorRing2.rotation.x = -Math.PI / 2; floorRing2.position.y = -2.785; scene.add(floorRing2);

// 希腊式柱子：柱础 + 带凹槽的柱身 + 柱头，原点在柱脚
const flutedGeo = (() => {
  const g = new THREE.CylinderGeometry(0.48, 0.56, 9.4, 96, 12, true);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), a = Math.atan2(z, x), r = Math.hypot(x, z);
    const k = 1 - 0.06 * Math.pow(0.5 + 0.5 * Math.cos(a * 20), 3);
    p.setX(i, Math.cos(a) * r * k); p.setZ(i, Math.sin(a) * r * k);
  }
  g.computeVertexNormals(); g.translate(0, 0.6 + 4.7, 0); return g;
})();
const echinusGeo = new THREE.LatheGeometry([[0.46, 0], [0.56, 0.1], [0.7, 0.26], [0.78, 0.4]].map(([x, y]) => new THREE.Vector2(x, y)), 48);
const COL_H = 10.7;
function makeColumn() {
  const c = new THREE.Group();
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1.5), marbleMat); plinth.position.y = 0.15;
  const t1 = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.13, 10, 40), marbleMat); t1.rotation.x = Math.PI / 2; t1.position.y = 0.42;
  const t2 = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.08, 10, 40), marbleMat); t2.rotation.x = Math.PI / 2; t2.position.y = 0.62;
  const shaft = new THREE.Mesh(flutedGeo, marbleMat);
  const ech = new THREE.Mesh(echinusGeo, marbleMat); ech.position.y = 10.0;
  const abacus = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.3, 1.7), marbleMat); abacus.position.y = 10.55;
  c.add(plinth, t1, t2, shaft, ech, abacus);
  return c;
}

// 会被炸飞的东西：记录原位和倒下后的位置，爆炸/复原时插值
const debris = [];
function addDebris(obj, fallP, fallQ, delay, hop, kind) {
  debris.push({ obj, homeP: obj.position.clone(), homeQ: obj.quaternion.clone(), fallP, fallQ, delay, hop, kind, dust: false, landed: false,
    base: { fallP: fallP.clone(), fallQ: fallQ.clone(), delay, hop } });
}
function poseDebris(d, k) {
  d.obj.position.lerpVectors(d.homeP, d.fallP, k);
  d.obj.position.y += Math.sin(k * Math.PI) * d.hop;
  d.obj.quaternion.slerpQuaternions(d.homeQ, d.fallQ, k);
}

const temple = new THREE.Group(); scene.add(temple);
const COLS = 11, colPos = [];
for (let i = 0; i < COLS; i++) {
  const a = Math.PI * 0.04 + (i / (COLS - 1)) * Math.PI * 0.92;
  const col = makeColumn();
  col.position.set(Math.cos(a) * 12, FLOOR_Y, -Math.sin(a) * 10.5 - 1);
  temple.add(col); colPos.push(col.position.clone());
  const out = new THREE.Vector3(col.position.x, 0, col.position.z).normalize();
  const tangent = new THREE.Vector3(out.z, 0, -out.x);
  const fq = new THREE.Quaternion().setFromAxisAngle(tangent, Math.PI / 2 + R0(-0.08, 0.05))
    .multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), R0(-1, 1)));
  const fp = col.position.clone().addScaledVector(out, R0(1.5, 4)); fp.y = GROUND_Y + 0.25 + (col.position.length() < 13 ? 0.45 : 0);
  addDebris(col, fp, fq, col.position.length() / 26, 0, 'fall');
}
// 横梁：架在相邻柱子顶上
for (let i = 0; i < COLS - 1; i++) {
  const a = colPos[i], b = colPos[i + 1], mid = a.clone().add(b).multiplyScalar(0.5);
  const len = a.distanceTo(b) + 1.6;
  const beam = new THREE.Group();

  // 爆炸瞬间的慢动作
  let ts = 1;
  if (state === 'boom') { boomReal += realDt; ts = boomReal < B.slow ? B.slowScale : Math.min(1, B.slowScale + (boomReal - B.slow) * 2.2); }
  const dt = realDt * ts;
  stateT += dt;
  heatShown += (heat - heatShown) * Math.min(1, realDt * 3);
  const h = heatShown;

  // ---- 摸头 ----
  let def = null;
  if (state === 'idle' || state === 'windup') {
    const rubbing = rubLeft > 0;
    rubLeft -= realDt;
    rubPhase += realDt * (rubbing ? 8.5 + h * 6 : 0);
    // 目标点：贴着头顶弧线来回；不摸时抬到上方悬停
    const tx = rubbing ? Math.sin(rubPhase) * (0.95 + h * 0.2) : hand.position.x * 0.92;
    const ty = rubbing ? headGroup.position.y + headTop(tx) - 0.08 : HAND_REST.y + Math.sin(time * 2) * 0.08;
    // 弹簧跟随，动作有惯性
    const k = 260, c = 2 * Math.sqrt(k) * 0.8;
    handVel.x += ((tx - hand.position.x) * k - handVel.x * c) * realDt;
    handVel.y += ((ty - hand.position.y) * k - handVel.y * c) * realDt;
    hand.position.x += handVel.x * realDt; hand.position.y += handVel.y * realDt;
    hand.position.z = HAND_REST.z;
    const contactY = headGroup.position.y + headTop(hand.position.x);
    const near = clamp01(1 - (hand.position.y - contactY) / 0.5);
    press += ((rubbing ? near : 0) - press) * Math.min(1, realDt * 14);
    // 手的姿态：顺着头顶坡度倾斜，随速度甩动，按下时掌心压扁
    const slope = -0.6 * hand.position.x;
    hand.material.rotation = Math.atan(slope) * 0.6 - THREE.MathUtils.clamp(handVel.x * 0.018, -0.18, 0.18);
    const squash = press * (0.07 + 0.03 * Math.sin(rubPhase * 2));
    hand.scale.set(2.6 * (1 + squash), 2.6 * (1 - squash), 1);
    handShadow.position.set(hand.position.x, contactY - 0.15, 0.04);
    handShadow.material.opacity = 0.2 + press * 0.6 - clamp01((hand.position.y - contactY) / 2) * 0.2;
    handShadow.visible = true;
    // 头皮被按下并跟着手拖动
    const speed = Math.abs(handVel.x);
    def = { x: hand.position.x, y: headTop(hand.position.x) - 0.1, dx: THREE.MathUtils.clamp(handVel.x * 0.03, -0.22, 0.22) * press, dy: -0.2 * press, r2: 0.55 };
    sfx.friction(press, speed);
    // 接触点的金色碎光
    sparkAcc += realDt * press * speed * (6 + h * 20);
    while (sparkAcc > 1) {
      sparkAcc--;
      fire.spawn(hand.position.x + R(-0.4, 0.4), contactY + R(-0.05, 0.15), 0.45, R(-1, 1) - handVel.x * 0.15, R(0.5, 2.5), R(0, 0.8), R(0.3, 0.7), 0.1, 0.03, GOLD, FIRE_END, 1, 1.5, -2);
    }
    // 头随手的方向歪
    wobbleV += -handVel.x * press * 0.25 * realDt * 60 * 0.05;
  } else {
    handShadow.visible = false;
    sfx.friction(0, 0);
  }

  // 头像晃动（弹簧）
  wobbleV += (-wobble * 60 - wobbleV * 7) * realDt; wobble += wobbleV * realDt;
  const jit = h * h * 0.05;
  headGroup.rotation.z = wobble * 0.05 + (Math.random() - 0.5) * jit * 0.6;
  headGroup.scale.set(1 + wobble * 0.01, 1 - press * 0.025 + Math.sin(time * (2 + h * 10)) * 0.008 * h, 1);
  headGroup.position.x = (Math.random() - 0.5) * jit;
  headGroup.position.y = 0.2 + Math.sin(time * 1.2) * 0.05 + (Math.random() - 0.5) * jit;

  // 环境随热度升级
  runes.forEach((r, i) => { r.rotation.z += dt * (0.15 + h * 3) * (i % 2 ? -1 : 1); });
  const auraCol = new THREE.Color(1, 0.72, 0.32).lerp(new THREE.Color(1, 0.18, 0.06), h);
  auraMat.color.copy(auraCol).multiplyScalar(0.7 + h * 1.8);
  aura.scale.setScalar(7 + h * 4 + Math.sin(time * 3) * 0.3 * h);
  runeMat.color.copy(auraCol).multiplyScalar(0.8 + h * 1.6);
  floorRingMat.color.copy(auraCol).multiplyScalar(1.8 + h * 2 + Math.sin(time * 4) * h);
  headLight.color.copy(auraCol); headLight.intensity = 30 + h * 120; headLight.distance = 40;
  headLight.position.set(0, 0.5, 2);
  nebulaMat.uniforms.time.value = time; nebulaMat.uniforms.heat.value = h;
  scene.fog.color.setRGB(0.07 + h * 0.12, 0.04 + h * 0.02, 0.11 - h * 0.06);
  stars.rotation.y += realDt * 0.01;
  bloom.strength = 0.55 + h * 0.9;

  // 火盆的火焰
  braziers.forEach(b => {
    b.light.intensity = (state === 'boom' || state === 'reform') ? 0 : 22 + Math.sin(time * 13 + b.x) * 3 + Math.random() * 4;
    if (state === 'boom' || state === 'reform') return;
    b.acc += realDt * 45 * Q;
    while (b.acc > 1) {
      b.acc--;
      fire.spawn(b.x + R(-0.35, 0.35), b.y, b.z + R(-0.35, 0.35), R(-0.1, 0.1), R(1.2, 2.4), R(-0.1, 0.1), R(0.35, 0.7), 0.6, 0.15, FIRE_MID, FIRE_END, 0.85, 0.5, 0.5);
    }
  });
  // 树林、草丛、巨石：平时随风摆，爆炸时按冲击波到达的先后被压倒、烧焦、掀飞
  const fMode = state === 'boom' ? 'boom' : state === 'reform' ? 'reform' : 'idle';
  const fe = state === 'reform' ? ease(Math.min(1, stateT / REFORM_LEN)) : 0;
  const treeBend = r => r < 75 ? 1.5 - (r - 19) / 56 * 1.15 : 0.3;
  updateField(pines, fMode, stateT, fe, time, treeBend, 60);
  updateField(cypresses, fMode, stateT, fe, time, treeBend, 60);
  updateField(grass, fMode, stateT, fe, time, r => r < 55 ? 1.4 : 0.5, 45);
  updateBoulders(fMode, stateT, fe);
  // 火炬：冲击波扫过就灭
  torches.forEach(tc => {
    if (state === 'reform' || (state === 'boom' && stateT > tc.r / SHOCK_SPEED)) return;
    tc.acc += realDt * 14 * Q;
    while (tc.acc > 1) { tc.acc--; fire.spawn(tc.x + R(-0.1, 0.1), tc.y, tc.z + R(-0.1, 0.1), R(-0.05, 0.05), R(0.8, 1.6), R(-0.05, 0.05), R(0.3, 0.55), 0.35, 0.08, FIRE_MID, FIRE_END, 0.8, 0.5, 0.4); }
  });
  // 被压倒的树烧起来
  if (state === 'boom' && stateT < 7.5) {
    burnAcc += dt * 110 * Q;
    while (burnAcc > 1) {
      burnAcc--;
      const tr = burningTrees[(Math.random() * burningTrees.length) | 0];
      if (!tr || stateT < tr.r / SHOCK_SPEED + 0.15) continue;
      const hg = tr.H * tr.s * R(0.2, 0.9);
      const x = tr.x + tr.out.x * Math.sin(tr.bend) * hg, z = tr.z + tr.out.z * Math.sin(tr.bend) * hg, y = tr.y + Math.cos(tr.bend) * hg;
      if (Math.random() < 0.75) fire.spawn(x + R(-0.4, 0.4), y, z + R(-0.4, 0.4), R(-0.2, 0.2), R(1, 3), R(-0.2, 0.2), R(0.4, 0.9), 0.7, 1.6, FIRE_MID, FIRE_END, 0.55, 0.5, 0.5);
      else smoke.spawn(x, y + 0.5, z, R(-0.3, 0.3), R(1, 2.5), R(-0.3, 0.3), R(2, 3.5), 1, 3, [0.4, 0.3, 0.25], SMOKE_DARK, 0.45, 0.3, 0.2);
    }
  }
  // 浮石缓缓起伏
  if (state === 'idle' || state === 'windup' || state === 'charge') rocks.forEach(r => {
    r.m.position.y = r.baseY + Math.sin(time * 0.5 + r.phase) * 0.6 + (state === 'charge' ? (Math.random() - 0.5) * 0.2 : 0);
    r.m.rotation.y += r.spin * realDt;
  });
  moonMat.uniforms.heat.value = h;
  shaftMat.uniforms.op.value = 0.18 + h * 0.3;
  shaftMat.uniforms.color.value.copy(auraCol);

  // 平台上升起的余烬
  if (state !== 'boom') {
    emberAcc += dt * (4 + h * 70) * Q;
    while (emberAcc > 1) {
      emberAcc--;
      const a = Math.random() * Math.PI * 2, r = R(0.5, 3.6);
      fire.spawn(Math.cos(a) * r, -2.75, Math.sin(a) * r * 0.6, R(-0.2, 0.2), R(0.6, 1.8) + h * 2, R(-0.2, 0.2), R(1.5, 3), 0.1, 0.04, GOLD, FIRE_END, R(0.5, 1), 0.3, 0.2);
    }
  }

  // ---- 状态机 ----
  let flash = 0, burnTarget = 0;
  if (state === 'idle' || state === 'windup') {
    deformIntact(def);
    pushTarget = 0; wideTarget = 0;
    if (state === 'windup' && stateT >= 0.95) {
      state = 'charge'; stateT = 0; sfx.charge();
      layoutShards(0, 0, 0); showShards(true);
    }
  } else if (state === 'charge') {
    const p = Math.min(1, stateT / 1.8);
    // 龟裂：缝隙越来越大，后面的光从缝里透出来
    layoutShards(0, p * p * 0.32, p * p * 0.05);
    headMat.color.setRGB(1 + p * 0.5, 1 + p * 0.3, 1 + p * 0.1);
    // 背后的光接着第 56 下的亮度继续增强，不会断
    auraMat.color.copy(auraCol).multiplyScalar(2.5 + Math.sin(time * 18) * 0.4 * p);
    aura.scale.setScalar(10 + p * 1.5 + Math.sin(time * 25) * 0.3 * p);
    shake = p * p * 0.1;
    pushTarget = ease(p) * 0.6;
    bloom.strength = 1.4;
    hand.position.y += realDt * 3; // 手被弹开
    hand.material.opacity = 1 - p;
    // 能量向内汇聚
    for (let i = 0; i < (4 + p * 10) * Q; i++) {
      _d.randomDirection().multiplyScalar(R(5, 9)); _d.z = -Math.abs(_d.z); // 只从后方和两侧汇聚，不贴着镜头飞
      fire.spawn(_d.x, _d.y + 0.2, _d.z, -_d.x * 1.7, -_d.y * 1.7, -_d.z * 1.7, 0.55, 0.12, 0.04, FIRE_MID, FIRE_END, 0.6, 0, 0);
    }
    if (stateT >= 1.8) startBoom();
  } else if (state === 'boom') {
    const t = stateT;
    layoutShards(t, 0.32, 0);
    const cool = Math.min(1, t / 2);
    auraMat.color.multiplyScalar(Math.max(0, 1 - boomReal / 0.3));
    headMat.color.setRGB(1.35 - cool * 0.35, 1.1 - cool * 0.2, 0.9 - cool * 0.05);
    // 碎片拖着火尾
    if (t < 2.2) for (let i = 0; i < 18 * Q; i++) {
      const tr = tris[(Math.random() * tris.length) | 0];
      fire.spawn(tr.wx, tr.wy + 0.2, tr.wz, 0, 0, 0, 0.5, 0.3, 0.1, FIRE_MID, FIRE_END, 0.45, 0, 0.5);
    }
    flash = Math.max(0, 1 - boomReal / 0.35) * 0.85 + Math.max(0, 1 - Math.abs(boomReal - 0.6) / 0.2) * 0.35;
    burnTarget = t < 4 ? 1 : Math.max(0.35, 1 - (t - 4) / 7);
    shake = t < 0.15 ? 0.4 : Math.max(0, 1.4 * Math.exp(-(t - 0.15) * 1.3)) + (t > 1.3 && t < 2 ? 0.5 : 0);
    pushTarget = 0; wideTarget = 1;
    bloom.strength = 0.7 + 0.7 * Math.exp(-t * 1.5);

    fireball.visible = t < 1.6;
    fireball.scale.setScalar(0.3 + 3.2 * (1 - Math.exp(-t * 5)));
    fireball.position.y = 0.2 + t * 2;
    fireball.material.opacity = Math.max(0, 1 - t / 1.6) * 0.35;
    shockAir.visible = t < 1.4;
    shockAir.scale.setScalar(t * 45); shockAir.material.opacity = Math.max(0, 1 - t / 1.4);
    wilson.visible = t > 0.2 && t < 2.2;
    wilson.scale.setScalar(4 + (t - 0.2) * 30);
    wilsonMat.uniforms.op.value = Math.sin(clamp01((t - 0.2) / 2) * Math.PI) * 0.28;
    shockFloors.forEach(m => {
      const tt = t - m.userData.delay;
      m.visible = tt > 0 && tt < 3;
      m.scale.setScalar(2 + tt * 28); m.material.opacity = Math.max(0, 1 - tt / 3);
    });
    // 天上地下被照亮
    headLight.position.set(B.windX * drift(t), cloudY(t), 4 + B.windZ * drift(t)); headLight.distance = 0;
    headLight.color.setRGB(1, 0.55, 0.25); headLight.intensity = 400 + 4000 * Math.exp(-t * 0.9);

    // 冲击波掠过：柱子倒下、横梁砸落、火盆和浮石被掀飞
    debris.forEach(d => {
      const kk = clamp01((t - d.delay) * (d.kind === 'fall' ? 0.75 : 0.6));
      if (kk > 0 && !d.dust) { d.dust = true; dustBurst(d.homeP, 30); }
      if (kk >= 1 && !d.landed && d.kind !== 'fly') { d.landed = true; dustBurst(d.fallP, 45); }
      poseDebris(d, d.kind === 'fly' ? 1 - Math.pow(1 - kk, 3) : kk * kk);
    });

    // 地面扬尘：贴地向外扩散的一圈
    if (!dustDone && t > 0.1) {
      dustDone = true;
      for (let i = 0; i < 900 * Q; i++) {
        const a = Math.random() * Math.PI * 2, s = R(10, 30);
        smoke.spawn(Math.cos(a) * 2, -3.1, Math.sin(a) * 2, Math.cos(a) * s, R(0, 2), Math.sin(a) * s, R(3, 5.5), 2, 7, [0.85, 0.5, 0.3], SMOKE_DARK, 0.6, 0.9, 0.3);
      }
    }
    // 蘑菇云：烟柱 + 翻卷的云冠
    const cy = cloudY(t), cr = cloudR(t), tube = 1.2 + cr * B.tubeK;
    const dx = B.windX * drift(t), dz = B.windZ * drift(t);
    if (t < 5.5) {
      const fade = clamp01((5.5 - t) / 2);
      stemAcc += dt * 320 * Q * fade;
      while (stemAcc > 1) {
        stemAcc--;
        const y0 = R(-3.3, cy - tube * 0.5), f = (y0 + 3.3) / (cy + 3.3), wr = (0.9 + f * 1.5) * B.stemW;
        const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * wr;
        const hot = Math.random() < Math.max(0.15, (0.8 - t * 0.2) * B.hot);
        const x = Math.cos(a) * rr + dx * f * f, z = Math.sin(a) * rr + dz * f * f, vy = R(3, 6);
        if (hot) fire.spawn(x, y0, z, 0, vy, 0, R(0.6, 1.2), 2, 3.5, Math.random() < 0.15 ? FIRE_HOT : FIRE_MID, FIRE_END, 0.3, 0.5, 0);
        else smoke.spawn(x, y0, z, 0, vy, 0, R(2.5, 4), 2.4, 4, SMOKE_HOT, SMOKE_DARK, 0.75, 0.3, 0);
      }
      capAcc += dt * 650 * Q * fade;
      while (capAcc > 1) {
        capAcc--;
        // 在环面上取点，速度沿环面切线：顶上往外翻、外侧往下卷
        // 一部分粒子集中到几个鼓包上，云冠不再是规整的圆环
        let a = Math.random() * Math.PI * 2, bulge = 1, lift = 0;
        if (Math.random() < 0.4) { const L = B.lobes[(Math.random() * B.lobes.length) | 0]; a = L.a + R(-0.45, 0.45); bulge = L.k; lift = L.up * tube; }
        const phi = Math.random() * Math.PI * 2;
        const dir = _d.set(Math.cos(a), 0, Math.sin(a));
        const ring = cr + tube * bulge * Math.cos(phi);
        const x = dir.x * ring + dx, z = dir.z * ring + dz, y = cy + lift + tube * bulge * Math.sin(phi) * 0.75;
        const roll = 1.5 + cr * 0.25, rise = 0.45 * 20 * Math.exp(-t * 0.45) * 0.8;
        const vx = dir.x * Math.sin(phi) * roll, vz = dir.z * Math.sin(phi) * roll, vy = -Math.cos(phi) * roll + rise;
        const hot = Math.random() < Math.max(0.12, (0.85 - t * 0.22) * B.hot);
        if (hot) fire.spawn(x, y, z, vx, vy, vz, R(0.7, 1.4), 3, 5.5, Math.random() < 0.12 ? FIRE_HOT : FIRE_MID, FIRE_END, 0.28, 0.4, 0);
        else smoke.spawn(x, y, z, vx, vy, vz, R(4, 6.5), 3.5, 7.5, SMOKE_HOT, SMOKE_DARK, 0.8, 0.35, 0);
      }
    }
    if (t > BOOM_LEN) startReform();
  } else if (state === 'reform') {
    const p = Math.min(1, stateT / REFORM_LEN), e = ease(p);
    layoutShards(BOOM_LEN * (1 - e), 0.32 * (1 - e), 0);
    const g = 1 + Math.sin(p * Math.PI) * 1.4;
    headMat.color.setRGB(g, g * 0.95, g * 0.8);
    debris.forEach(d => poseDebris(d, 1 - e));
    wideTarget = 0; pushTarget = 0;
    burnTarget = 0;
    heat = 1 - e; // 热度跟着复原进度一起退，天空、雾、光晕同步褪色
    hand.material.opacity = clamp01(p * 2 - 1);
    // 碎片回归时的金色光尘
    if (p < 0.9) for (let i = 0; i < 5; i++) {
      const tr = tris[(Math.random() * tris.length) | 0];
      fire.spawn(tr.wx, tr.wy + 0.2, tr.wz + 0.2, R(-0.3, 0.3), R(-0.3, 0.3), R(-0.3, 0.3), 0.6, 0.18, 0.05, GOLD, FIRE_END, 0.8, 1, 0);
    }
    if (stateT >= REFORM_LEN) {
      state = 'idle'; count = 0; heat = 0;
      layoutShards(0, 0, 0); headMat.color.setRGB(1, 1, 1);
      showShards(false); fracture(); deformIntact(null);
      debris.forEach(d => { d.dust = d.landed = false; poseDebris(d, 0); });
      sfx.setDrone(0); updateUI();
      burstFire(0, 0.2, 0, 150 * Q, 1, 5, 1, 0.2);
    }
  }

  // ---- 镜头：近景 → 推近脸 → 拉到远景看蘑菇云 ----
  push += (pushTarget - push) * Math.min(1, realDt * 3);
  wide += (wideTarget - wide) * Math.min(1, realDt * (wideTarget > wide ? 2.6 : 1.6));
  const w = ease(clamp01(wide));
  const th = B.camAngle + B.camSpin * boomReal * 10;
  camPos.set(Math.sin(time * 0.25) * 0.6, 0.6, baseDist - h * 1.4 - push * 4)
    .lerp(_p3.set(Math.sin(th) * B.camDist * wideK, 2 + B.camH, Math.cos(th) * B.camDist * wideK), w);
  camLook.set(0, 0.3 + w * B.lookH, 0);
  camPos.x += (Math.random() - 0.5) * shake; camPos.y += (Math.random() - 0.5) * shake;
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  camera.far = 500; camera.updateProjectionMatrix();
  if (state !== 'boom') shake *= 0.9;

  burn += (burnTarget - burn) * Math.min(1, realDt * (burnTarget > burn ? 4 : 1.2));
  nebulaMat.uniforms.flash.value = flash * 0.4 + burn * 0.3;
  nebulaMat.uniforms.heat.value = Math.max(h, burn);
  $flash.style.opacity = Math.min(1, flash).toFixed(3);

  fire.update(dt); smoke.update(dt);
}

function dustBurst(p, n) {
  for (let i = 0; i < n * Q; i++) {
    const a = Math.random() * Math.PI * 2, s = R(1.5, 5);
    smoke.spawn(p.x + R(-1, 1), GROUND_Y + 0.4, p.z + R(-1, 1), Math.cos(a) * s, R(0.3, 2), Math.sin(a) * s, R(1.8, 3.5), 1.4, 3.6, [0.55, 0.38, 0.3], SMOKE_DARK, 0.55, 1.2, 0.25);
  }
}

function startBoom() {
  state = 'boom'; stateT = 0; boomReal = 0; dustDone = false; stemAcc = capAcc = 0;
  rollBoom(); rollShardVelocities();
  debris.forEach(d => {
    const b = d.base, out = _p3.set(d.homeP.x, 0, d.homeP.z).normalize();
    d.fallP.copy(b.fallP).addScaledVector(out, d.kind === 'fly' ? R(-3, 8) : R(-0.8, 2.5));
    d.fallQ.copy(b.fallQ).premultiply(_qa.setFromAxisAngle(_up, d.kind === 'fly' ? R(-3, 3) : R(-0.35, 0.35)));
    d.hop = b.hop * R(0.6, 1.5); d.delay = b.delay + R(-0.08, 0.15);
  });
  sfx.boom();
  for (let i = 0; i < 450 * Q; i++) {
    const d = new THREE.Vector3().randomDirection(), sp = R(4, 20);
    fire.spawn(d.x * 0.5, 0.2 + d.y * 0.5, d.z * 0.5, d.x * sp, d.y * sp + 2, d.z * sp, R(0.8, 1.6), 1, 2.6, Math.random() < 0.2 ? FIRE_HOT : FIRE_MID, FIRE_END, R(0.15, 0.3), 2.4, 1.5);
  }
  for (let i = 0; i < 700 * Q; i++) { // 火星
    const d = new THREE.Vector3().randomDirection(), s = R(14, 40);
    fire.spawn(0, 0.2, 0, d.x * s, Math.abs(d.y) * s + 6, d.z * s, R(1.5, 3), 0.2, 0.08, FIRE_HOT, FIRE_MID, 1, 0.5, -9);
  }
  hand.visible = false;
}
function startReform() {
  state = 'reform'; stateT = 0;
  hand.visible = true; hand.position.copy(HAND_REST); handVel.set(0, 0);
  fireball.visible = shockAir.visible = wilson.visible = false;
  shockFloors.forEach(m => m.visible = false);
  sfx.reform();
}

deformIntact(null);
