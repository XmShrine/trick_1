<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Bujo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261114-rhr">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark"></span><b>mini bujo</b></div>
  <div class="file">
    <span id="fstat" class="fstat"></span>
    <button id="bReconnect" class="btn" hidden></button>
    <button id="bOpen" class="btn">打开</button>
    <button id="bSave" class="btn primary">保存</button>
    <button id="bSaveAs" class="btn">另存为</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div id="banner" class="banner" hidden></div>

<main class="wrap">
  <div class="book">
    <div class="navbar" id="navbar"></div>
    <div class="spread" id="spread">
      <section class="page left" id="pL"></section>
      <section class="page right" id="pR"></section>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面"></nav>
</main>

<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=20261114-rhr"></script>
</body>
</html>
