<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选课模拟器 · 南开大学 2026-2027 学年第一学期</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfbfd; --line:#e3e6ec; --line2:#eef0f4;
  --ink:#161a20; --ink2:#5b6472; --ink3:#8b94a3;
  --accent:#7a1f2b; --accent-ink:#fff; --accent-soft:#f7ecee;
  --ok:#1c7a4a; --ok-soft:#e8f5ee; --warn:#a8631a; --warn-soft:#fdf1e3;
  --bad:#b3261e; --bad-soft:#fceceb; --sel:#2d5bd7; --sel-soft:#eaf0fd;
  --shadow:0 1px 2px rgba(16,20,28,.06),0 8px 24px rgba(16,20,28,.06);
  --r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101318; --panel:#171b22; --panel2:#1c2129; --line:#2a313c; --line2:#232932;
  --ink:#e8ebf0; --ink2:#a2acbb; --ink3:#6f7987;
  --accent:#d98a96; --accent-ink:#1a1013; --accent-soft:#2a1c20;
  --ok:#5cc48d; --ok-soft:#16281f; --warn:#e0a463; --warn-soft:#2b2116;
  --bad:#f2867d; --bad-soft:#2c1a19; --sel:#8fb0ff; --sel-soft:#1a2236;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--sel)}

/* ---------- 顶栏 ---------- */
.bar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(0,0,0,.02)}
.bar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:2px}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--ink3)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--ink2);white-space:nowrap;transition:.12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.small button{padding:4px 9px;font-size:12px}
.stat{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--ink2)}
.stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 11px;
  cursor:pointer;font-size:12.5px;color:var(--ink2)}
.ghost:hover{border-color:var(--ink3);color:var(--ink)}

/* ---------- 阶段条 ---------- */
.phasebar{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:12.5px}
.phasebar-in{max-width:1360px;margin:0 auto;padding:7px 18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--ink2)}
.phasebar b{color:var(--ink)}

main{max-width:1360px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;align-items:start}
@media (max-width:1080px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>h2{margin:0;padding:12px 15px;font-size:13px;letter-spacing:.4px;color:var(--ink2);
  border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;font-weight:600}
.card>h2 .sub{font-weight:400;color:var(--ink3);font-size:11.5px;margin-left:auto}

/* ---------- 筛选 ---------- */
.filters{padding:12px 15px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;color:var(--ink);font:inherit;font-size:13px;outline:none;min-width:0}
input[type=search]{flex:1;min-width:180px}
input[type=search]:focus,select:focus{border-color:var(--sel)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 11px;
  font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed=true]{background:var(--sel-soft);border-color:var(--sel);color:var(--sel);font-weight:600}
.lbl{font-size:12px;color:var(--ink3);margin-right:-2px}

/* ---------- 课表 ---------- */
.gridwrap{overflow-x:auto;padding:0 0 4px}
.grid{display:grid;grid-template-columns:46px repeat(7,minmax(122px,1fr));min-width:920px}
.gh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 4px;text-align:center;font-size:12px;color:var(--ink2);font-weight:600;z-index:2}
.gp{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:11px;color:var(--ink3);background:var(--panel2);font-variant-numeric:tabular-nums}
.gp em{font-style:normal;font-size:13px;color:var(--ink2);font-weight:600}
.cell{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-height:52px;
  padding:3px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;transition:background .1s}
.cell:hover{background:var(--panel2)}
.cell.brk{border-bottom:2px solid var(--line)}
.cnt{position:absolute;right:4px;bottom:3px;font-size:10.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums;pointer-events:none}
.cell:hover .cnt{color:var(--sel)}
.blk{border-radius:6px;padding:3px 5px;font-size:11.5px;line-height:1.35;overflow:hidden;
  border-left:3px solid var(--bc,var(--sel));background:var(--bs,var(--sel-soft));color:var(--ink)}
.blk b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:var(--ink2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.blk.clash{outline:1.5px solid var(--bad);outline-offset:-1px}
.blk.cont{flex:none;height:9px;padding:0;opacity:.5;border-radius:4px}
.clashmark{position:absolute;right:4px;top:2px;font-size:10px;color:var(--bad);font-weight:700;z-index:1}

/* ---------- 列表 ---------- */
.list{padding:6px 0 10px}
.item{padding:11px 15px;border-bottom:1px solid var(--line2);display:flex;gap:12px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item:hover{background:var(--panel2)}
.item .mainc{flex:1;min-width:0}
.tl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl .no{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink3);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tl .nm{font-weight:600;font-size:14px}
.meta{color:var(--ink2);font-size:12.5px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.meta i{font-style:normal;color:var(--ink3)}
.sess{margin-top:5px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.sess code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink);
  background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:0 5px;margin-right:6px}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid transparent;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-neu{background:var(--panel2);color:var(--ink2);border-color:var(--line)}
.t-sel{background:var(--sel-soft);color:var(--sel)}
.act{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:74px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;
  cursor:pointer;font-size:12.5px;text-align:center;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.on{background:var(--sel-soft);border-color:var(--sel);color:var(--sel);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:26px 15px;text-align:center;color:var(--ink3);font-size:13px}
.more{padding:10px;text-align:center}

/* ---------- 侧栏 ---------- */
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:104px}
@media (max-width:1080px){.side{position:static}}
.mycount{padding:9px 15px;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--line2);
  display:flex;gap:12px;flex-wrap:wrap}
.mycount b{color:var(--ink)}
.myitem{padding:9px 15px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start}
.myitem:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:3px;margin-top:6px;flex:none}
.myitem .x{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.myitem .x:hover{color:var(--bad)}
.rules{padding:13px 15px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.rules h3{margin:14px 0 5px;font-size:12.5px;color:var(--ink)}
.rules h3:first-child{margin-top:0}
.rules ul{margin:4px 0;padding-left:17px}
.rules li{margin:2px 0}
.rules table{border-collapse:collapse;width:100%;margin:6px 0;font-size:11.5px}
.rules td,.rules th{border:1px solid var(--line2);padding:3px 6px;text-align:left}
.rules th{background:var(--panel2);color:var(--ink2);font-weight:600}
.rules tr.now td{background:var(--accent-soft);color:var(--ink);font-weight:600}
.note{background:var(--warn-soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  color:var(--ink2);font-size:12px;margin:8px 0}

/* ---------- 抽屉 ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.34);opacity:0;pointer-events:none;
  transition:opacity .16s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s cubic-bezier(.3,.7,.3,1);
  z-index:51;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh b{font-size:14px} .dh .sub{color:var(--ink3);font-size:12px}
.dh button{margin-left:auto;border:0;background:transparent;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1}
.dbody{overflow-y:auto;flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);
  color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
  transition:.18s;z-index:60;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dayseg{display:none}

/* ================= 移动端 ================= */
@media (max-width:1080px){
  main{display:flex;flex-direction:column;gap:14px}
  main>div,main>aside.side{display:contents}
  #cardGrid{order:1;margin-bottom:0!important}
  #cardMine{order:2}
  #cardList{order:3}
  #cardRules{order:4}
}
@media (max-width:640px){
  body{font-size:13.5px}
  main{padding:12px}
  .bar-in{padding:8px 12px;gap:8px}
  .brand b{font-size:14px}
  .brand span{font-size:10.5px}
  .bar-in .seg{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .bar-in .seg::-webkit-scrollbar{display:none}
  .seg button{padding:6px 10px;font-size:12.5px;flex:1 0 auto}
  .seg.small{width:auto}
  .stat{margin-left:0;width:100%;gap:10px;font-size:12px;flex-wrap:wrap}
  .stat b{font-size:14px}
  .ghost{padding:5px 9px;font-size:12px}
  .phasebar-in{padding:7px 12px;gap:6px}
  .card>h2{padding:11px 13px}
  .card>h2 .sub{width:100%;margin-left:0;order:2}
  .filters{padding:11px 13px;gap:9px}
  input[type=search]{min-width:100%}
  #unit,#campus{flex:1;min-width:0}
  .dayseg{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:2px;flex-wrap:nowrap}
  .dayseg::-webkit-scrollbar{display:none}
  .dayseg .chip{flex:0 0 auto;padding:5px 12px}
  .grid{min-width:0}
  .gp{font-size:10.5px}
  .cell{min-height:46px}
  .blk b{font-size:11.5px;white-space:normal}
  .item{flex-direction:column;gap:8px;padding:11px 13px}
  .act{flex-direction:row;min-width:0}
  .act .btn{flex:1}
  .myitem,.mycount,.rules{padding-left:13px;padding-right:13px}
  .drawer{width:100%;top:auto;height:min(86vh,860px);border-left:0;border-top:1px solid var(--line);
    border-radius:15px 15px 0 0;transform:translateY(100%)}
  .drawer.on{transform:none}
  .dh{padding:12px 14px}
  .dh::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:36px;height:4px;border-radius:2px;background:var(--line)}
  .dh{position:relative;padding-top:16px}
  footer{padding:6px 12px 30px}
}
footer{max-width:1360px;margin:0 auto;padding:10px 18px 34px;color:var(--ink3);font-size:11.5px;line-height:1.7}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand"><b>选课模拟器</b><span>南开大学 2026–2027 学年第一学期 · 数学科学学院</span></div>
  <div class="seg" id="phaseSeg"></div>
  <div class="seg small" id="gradeSeg"></div>
  <div class="stat">
    <span>已选 <b id="stN">0</b> 门</span>
    <span>周学时 <b id="stH">0</b></span>
    <span id="stC" class="tag t-ok">无冲突</span>
    <button class="ghost" id="btnCopy">复制序号</button>
    <button class="ghost" id="btnClear">清空</button>
  </div>
</div></header>
<div class="phasebar"><div class="phasebar-in" id="phaseInfo"></div></div>

<main>
<div>
  <section class="card" id="cardGrid" style="margin-bottom:18px">
    <h2>课表总览<span class="sub" id="gridSub"></span></h2>
    <div class="filters" id="filters">
      <div class="frow">
        <input type="search" id="q" placeholder="搜索课程名 / 教师 / 选课序号 / 教室">
        <select id="unit"></select>
        <select id="campus">
          <option value="">全部校区</option><option>八里台</option><option>津南</option><option>在线</option><option>泰达</option>
        </select>
      </div>
      <div class="frow" id="chips">
        <span class="lbl">快捷</span>
        <button class="chip" data-k="major">数学科学学院</button>
        <button class="chip" data-k="ge_opt">通识选修课</button>
        <button class="chip" data-k="ge_req">通识必修课</button>
        <button class="chip" data-k="other">其他学院</button>
        <span style="width:8px"></span>
        <button class="chip" id="chipOnly">只看本阶段可选</button>
        <button class="chip" id="chipX">只看有跨专业名额</button>
        <button class="chip" id="chipEmpty">隐藏空节次</button>
      </div>
      <div class="frow dayseg" id="dayseg"></div>
    </div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
  </section>

  <section class="card" id="cardList">
    <h2>课程列表<span class="sub" id="listSub"></span></h2>
    <div class="list" id="list"></div>
  </section>
</div>

<aside class="side">
  <section class="card" id="cardMine">
    <h2>我的选课<span class="sub" id="mySub"></span></h2>
    <div class="mycount" id="myCount"></div>
    <div id="myList"></div>
  </section>
  <section class="card" id="cardRules">
    <h2>选课规则（数学科学学院视角）</h2>
    <div class="rules" id="rules"></div>
  </section>
</aside>
</main>

<footer id="foot"></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><div><b id="dTitle"></b><div class="sub" id="dSub"></div></div><button id="dClose">×</button></div>
  <div class="dbody" id="dBody"></div>
</aside>

function avail(c, ph){

  }

/* ===================== 工具 ===================== */
const esc = t => String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hue = t => { let h=0; for(const ch of t) h=(h*31+ch.charCodeAt(0))%360; return h; };
function colorOf(c){ const h=hue(c.t+c.n); return {bc:`hsl(${h} 62% 48%)`, bs:`hsl(${h} 62% 48% / .13)`}; }
function sessTxt(s){
  if(!s.d) return '未排固定时间';
  return `周${DAYS[s.d-1]} 第${s.a}${s.b>s.a?'–'+s.b:''}节${s.w?'（'+s.w+' 周）':''}`;
}
function overlap(s1,s2){ return s1.d&&s2.d&&s1.d===s2.d && s1.a<=s2.b && s2.a<=s1.b && (s1.m & s2.m)!==0; }
function conflictsOf(c){
  const out=[];
  for(const n of picked){ if(n===c.n) continue; const o=byNo.get(n);
    for(const s1 of c.s) for(const s2 of o.s) if(overlap(s1,s2)) out.push({other:o,s1,s2});
  }
  return out;
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2400); }

/* ===================== 筛选 ===================== */
function match(c){
  if(state.kinds.length && !state.kinds.includes(c.k)) return false;
  if(state.unit && U[c.u]!==state.unit) return false;
  if(state.campus && !c.cp.includes(state.campus)) return false;
  if(state.onlyX && !(c.x>0)) return false;
  if(state.onlyAvail && avail(c,state.phase).s==='no') return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const hay=(c.n+' '+c.t+' '+c.tt.join(' ')+' '+U[c.u]+' '+c.mo+' '+c.s.map(s=>s.r).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function filtered(){ return CS.filter(match); }

/* ===================== 渲染：顶栏 ===================== */
function renderTop(){
  document.getElementById('phaseSeg').innerHTML = PHASES.map(p=>
    `<button data-p="${p.id}" aria-pressed="${state.phase===p.id}">${p.name}</button>`).join('');
  document.getElementById('gradeSeg').innerHTML =
    `<button data-g="old" aria-pressed="${state.grade==='old'}">2022–2025级</button>`+
    `<button data-g="fresh" aria-pressed="${state.grade==='fresh'}">2026级</button>`;
  const p = PHASES.find(x=>x.id===state.phase);
  document.getElementById('phaseInfo').innerHTML =
    `<b>${p.name}</b><span>${state.grade==='old'?p.old:p.fresh}</span><span>·</span><span>${PHASE_DESC[state.phase]}</span>`;
}

/* ===================== 渲染：课表 ===================== */
function renderDaySeg(){
  const cur = activeDay();
  document.getElementById('dayseg').innerHTML =
    `<button class="chip" data-day="all" aria-pressed="${cur==='all'}">全周</button>` +
    DAYS.map((d,i)=>`<button class="chip" data-day="${i+1}" aria-pressed="${cur===i+1}">周${d}</button>`).join('');
}
function renderGrid(){
  const list = filtered();
  const cnt = Array.from({length:8},()=>new Array(PMAX+1).fill(0));
  for(const c of list) for(const s of c.s){ if(!s.d||!s.a) continue;
    for(let p=s.a;p<=Math.min(s.b,PMAX);p++) cnt[s.d][p]++; }

  const mine = Array.from({length:8},()=>Array.from({length:PMAX+1},()=>[]));
  for(const n of picked){ const c=byNo.get(n);
    c.s.forEach(s=>{ if(!s.d||!s.a) return;
      for(let p=s.a;p<=Math.min(s.b,PMAX);p++) mine[s.d][p].push({c,s,head:p===s.a}); }); }

  const cur = activeDay();
  const days = cur==='all' ? [1,2,3,4,5,6,7] : [cur];
  const gridEl = document.getElementById('grid');
  gridEl.style.gridTemplateColumns = days.length>1
    ? '46px repeat(7,minmax(122px,1fr))' : '40px minmax(0,1fr)';
  let h = '<div class="gh"></div>' + days.map(d=>`<div class="gh">周${DAYS[d-1]}</div>`).join('');
  const rowUsed = p => days.some(d=>cnt[d][p]||mine[d][p].length);
  for(let p=1;p<=PMAX;p++){
    if(state.hideEmpty && !rowUsed(p)) continue;
    const brk = (p===4||p===6||p===10)?' brk':'';
    h += `<div class="gp${brk}"><em>${p}</em></div>`;
    for(const d of days){
      const blocks = mine[d][p];
      const covered = blocks.length>0;
      let inner = blocks.map(({c,s,head})=>{
        const col=colorOf(c); const span=Math.min(s.b,PMAX)-s.a+1;
        const clash = conflictsOf(c).some(cf=>cf.s1===s);
        if(!head) return `<div class="blk cont${clash?' clash':''}" style="--bc:${col.bc};--bs:${col.bs}" data-no="${c.n}"></div>`;
        return `<div class="blk${clash?' clash':''}" style="--bc:${col.bc};--bs:${col.bs}"
          data-no="${c.n}"><b>${esc(c.t)}</b><span>${esc(s.r||'')}${s.g?' '+s.g:''}${span>1?' · '+s.a+'–'+s.b+'节':''}</span></div>`;
      }).join('');
      const clashCell = blocks.length>1 && blocks.some(({c,s})=>conflictsOf(c).some(cf=>cf.s1===s));
      h += `<div class="cell${brk}" data-d="${d}" data-p="${p}">${clashCell?'<span class="clashmark">⚠</span>':''}${inner}`
         + (cnt[d][p]&&!covered?`<span class="cnt">${cnt[d][p]}</span>`:'') + `</div>`;
    }
  }
  gridEl.innerHTML = h;
  document.getElementById('gridSub').textContent = isNarrow()
    ? '数字＝该节次符合筛选的教学班数 · 点格子看有哪些课'
    : '右下角数字＝该节次下符合当前筛选、且本阶段可选的教学班数量 · 点格子查看';
}

/* ===================== 渲染：列表 ===================== */
function courseRow(c,{compact}={}){
  const a = avail(c,state.phase), on = picked.has(c.n);
  const cf = on?[]:conflictsOf(c);
  const tag = a.s==='ok'?'t-ok':a.s==='warn'?'t-warn':'t-bad';
  const sess = c.s.map(s=>`<div><code>${s.d?'周'+DAYS[s.d-1]:'—'}</code>`+
      `${s.a?`第 ${s.a}${s.b>s.a?'–'+s.b:''} 节`:'未排固定时间'} `+
      `${s.w?'· 周次 '+esc(s.w)+' ':''}${s.t?'· '+esc(s.t)+' ':''}${s.r?'· '+esc(s.r):''}${s.g?' '+s.g:''}</div>`).join('');
  return `<div class="item" data-no="${c.n}">
    <div class="mainc">
      <div class="tl"><span class="no">${c.n}</span><span class="nm">${esc(c.t)}</span>
        <span class="tag ${tag}">${esc(a.label)}</span>
        ${c.x>0?`<span class="tag t-neu">跨专业 ${c.x}</span>`:''}
        ${on?'<span class="tag t-sel">已选</span>':''}
        ${cf.length?`<span class="tag t-bad">与已选冲突</span>`:''}</div>
      <div class="meta"><i>${esc(U[c.u])}</i>${c.mo?`<i>· ${esc(c.mo)}</i>`:''}
        <i>· ${KINDS[c.k]}</i>${c.hr?`<i>· 周 ${c.hr} 学时</i>`:''}
        ${c.nt?`<i>· ${esc(c.nt)}</i>`:''}</div>
      <div class="sess">${sess}</div>
    </div>
    <div class="act">
      <button class="btn ${on?'on':'pri'}" data-act="${on?'drop':'take'}" data-no="${c.n}">${on?'退课':'选课'}</button>
      <button class="btn" data-act="info" data-no="${c.n}">详情</button>
    </div></div>`;
}
function renderList(){
  let list = filtered();
  if(state.slot){ const [d,p]=state.slot;
    const set=new Set(slotIdx[d][p]); list = list.filter(c=>set.has(c.i)); }
  const el = document.getElementById('list');
  const shown = list.slice(0,state.limit);
  el.innerHTML = shown.length
    ? shown.map(c=>courseRow(c)).join('') +
      (list.length>shown.length?`<div class="more"><button class="btn" id="more">还有 ${list.length-shown.length} 个教学班，继续显示</button></div>`:'')
    : `<div class="empty">没有符合条件的教学班。试试放宽筛选，或切换到别的阶段。</div>`;
  document.getElementById('listSub').textContent =
    (state.slot?`周${DAYS[state.slot[0]-1]} 第${state.slot[1]}节 · `:'') + `共 ${list.length} 个教学班`;
}

/* ===================== 渲染：我的选课 ===================== */
function renderMine(){
  const arr = [...picked].map(n=>byNo.get(n)).sort((a,b)=>a.n.localeCompare(b.n));
  const hrs = arr.reduce((s,c)=>s+c.hr,0);
  let clashPairs = new Set();
  for(const c of arr) for(const cf of conflictsOf(c)) clashPairs.add([c.n,cf.other.n].sort().join('-'));
  document.getElementById('stN').textContent = arr.length;
  document.getElementById('stH').textContent = hrs;
  const sc = document.getElementById('stC');
  sc.textContent = clashPairs.size? `${clashPairs.size} 处时间冲突` : '无冲突';
  sc.className = 'tag ' + (clashPairs.size?'t-bad':'t-ok');
  const byKind = {};
  arr.forEach(c=>byKind[c.k]=(byKind[c.k]||0)+1);
  document.getElementById('myCount').innerHTML = arr.length
    ? Object.keys(KINDS).filter(k=>byKind[k]).map(k=>`<span>${KINDS[k]} <b>${byKind[k]}</b></span>`).join('')
    : '<span>还没有选课。点课表格子或下面的列表加课。</span>';
  document.getElementById('mySub').textContent = arr.length?`${arr.length} 门`:'';
  document.getElementById('myList').innerHTML = arr.map(c=>{
    const col=colorOf(c), a=avail(c,state.phase);
    const bad = a.s==='no';
    return `<div class="myitem">
      <span class="dot" style="background:${col.bc}"></span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${esc(c.t)} <span class="no" style="font-weight:400">${c.n}</span></div>
        <div style="color:var(--ink2);font-size:11.5px">${c.s.map(sessTxt).join(' / ')}</div>
        ${bad?`<div class="tag t-bad" style="margin-top:3px;display:inline-block">本阶段不可选：${esc(a.label)}</div>`:''}
      </div>
      <button class="x" data-act="drop" data-no="${c.n}" title="退课">×</button></div>`;
  }).join('');
}

/* ===================== 抽屉 ===================== */
function openDrawer(title,sub,html){
  document.getElementById('dTitle').textContent=title;
  document.getElementById('dSub').textContent=sub||'';
  document.getElementById('dBody').innerHTML=html;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){ document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on'); }

function showSlot(d,p){
  const idxs = slotIdx[d][p];
  const list = idxs.map(i=>CS[i]).filter(match)
      .sort((a,b)=> (U[a.u]===U[b.u]? a.t.localeCompare(b.t,'zh') || a.n.localeCompare(b.n)
                                    : U[a.u].localeCompare(U[b.u],'zh')));
  const html = list.length
    ? list.map(c=>courseRow(c)).join('')
    : `<div class="empty">这一节没有符合当前筛选的教学班。</div>`;
  openDrawer(`周${DAYS[d-1]} 第 ${p} 节`, `符合当前筛选 ${list.length} 个教学班（该节次全校共 ${idxs.length} 个）`, html);
}
function showCourse(n){
  const c=byNo.get(n), a=avail(c,state.phase), cf=conflictsOf(c);
  const html = `<div style="padding:14px 16px">
    <div class="meta" style="margin-bottom:8px"><i>${esc(U[c.u])}</i><i>· ${KINDS[c.k]}</i>
      ${c.mo?`<i>· ${esc(c.mo)}</i>`:''}${c.nt?`<i>· ${esc(c.nt)}</i>`:''}</div>
    <div class="note" style="background:var(--${a.s==='ok'?'ok':a.s==='warn'?'warn':'bad'}-soft)">
      <b>${PHASES.find(p=>p.id===state.phase).name}：${esc(a.label)}</b><br>${esc(a.why)}
      ${a.quotaNote?'<br>'+esc(a.quotaNote):''}</div>
    <table class="rules" style="width:100%;border-collapse:collapse;font-size:12.5px">
      <tr><th style="width:88px">选课序号</th><td>${c.n}</td></tr>
      <tr><th>选课名额</th><td>${c.q||'—'}（培养方案内，含辅修、重修）</td></tr>
      <tr><th>跨专业名额</th><td>${c.x||'—'}</td></tr>
      <tr><th>教师</th><td>${esc(c.tt.join('、'))||'—'}</td></tr>
      <tr><th>校区</th><td>${c.cp.join('、')}</td></tr>
      <tr><th>周学时</th><td>${c.hr||'—'}</td></tr>
    </table>
    <h3 style="margin:14px 0 6px;font-size:13px">上课安排</h3>
    <div class="sess">${c.s.map(s=>`<div><code>${s.d?'周'+DAYS[s.d-1]:'—'}</code>`+
       `${s.a?`第 ${s.a}${s.b>s.a?'–'+s.b:''} 节`:'未排固定时间'} ${s.w?'· 周次 '+esc(s.w):''} `+
       `${s.t?'· '+esc(s.t):''} ${s.r?'· '+esc(s.r):''} ${s.g?s.g:''}</div>`).join('')}</div>
    ${cf.length?`<h3 style="margin:14px 0 6px;font-size:13px;color:var(--bad)">与已选课程冲突</h3>
      <div class="sess">${cf.map(x=>`<div>${esc(x.other.t)}（${x.other.n}）：${sessTxt(x.s2)}</div>`).join('')}</div>`:''}
    <h3 style="margin:14px 0 6px;font-size:13px">同名课程的其他教学班</h3>
    <div class="sess">${CS.filter(o=>o.t===c.t&&o.n!==c.n).slice(0,14).map(o=>
        `<div><code>${o.n}</code>${o.s.map(sessTxt).join(' / ')} · ${esc(o.tt.join('、'))} <span class="tag ${avail(o,state.phase).s==='ok'?'t-ok':avail(o,state.phase).s==='warn'?'t-warn':'t-bad'}">${esc(avail(o,state.phase).label)}</span></div>`
      ).join('')||'<div>没有其他教学班</div>'}</div>
    <div style="margin-top:16px"><button class="btn ${picked.has(c.n)?'on':'pri'}" data-act="${picked.has(c.n)?'drop':'take'}" data-no="${c.n}" style="width:100%">${picked.has(c.n)?'退课':'选课'}</button></div>
  </div>`;
  openDrawer(c.t, c.n+' · '+U[c.u], html);
}

/* ===================== 选课动作 ===================== */
function take(n){
  const c=byNo.get(n), a=avail(c,state.phase);
  if(a.s==='no'){ toast('本阶段选不了：'+a.label); return; }
  const cf=conflictsOf(c);
  if(cf.length){
    const t=cf[0];
    if(!confirm(`时间冲突：\n${c.t}（${c.n}）与已选的 ${t.other.t}（${t.other.n}）在${sessTxt(t.s1)}重叠。\n\n真实系统不允许冲突选课（可对其中一门申请自修）。仍要加入模拟课表吗？`)) return;
  }
  picked.add(n); save(); renderAll();
  toast(a.s==='warn' ? `已加入：${c.t} —— ${a.label}，以教务系统实际可选的班为准` : `已选：${c.t}（${c.n}）`);
}
function drop(n){ picked.delete(n); save(); renderAll(); toast('已退课：'+byNo.get(n).t); }

/* ===================== 事件 ===================== */
function renderAll(){ renderTop(); renderDaySeg(); renderGrid(); renderList(); renderMine(); renderRules(); }
mqNarrow.addEventListener('change', ()=>{
  if(isNarrow() && state.day==='all'){ const wd=new Date().getDay(); state.day = wd===0?7:wd; }
  renderDaySeg(); renderGrid();
});

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(b){ const n=b.dataset.no;
    if(b.dataset.act==='take') take(n);
    else if(b.dataset.act==='drop') drop(n);
    else if(b.dataset.act==='info') showCourse(n);
    return; }
  const ph = e.target.closest('#phaseSeg button');
  if(ph){ state.phase=ph.dataset.p; state.limit=60; save(); renderAll(); return; }
  const gr = e.target.closest('#gradeSeg button');
  if(gr){ state.grade=gr.dataset.g; save(); renderTop(); renderRules(); return; }
  const dchip = e.target.closest('#dayseg .chip');
  if(dchip){ const v=dchip.dataset.day; state.day = v==='all'?'all':+v; save();
             renderDaySeg(); renderGrid(); return; }
  const chip = e.target.closest('#chips .chip');
  if(chip){
    if(chip.id==='chipEmpty'){ state.hideEmpty=!state.hideEmpty; chip.setAttribute('aria-pressed',state.hideEmpty); }
    else if(chip.id==='chipOnly'){ state.onlyAvail=!state.onlyAvail; chip.setAttribute('aria-pressed',state.onlyAvail); }
    else if(chip.id==='chipX'){ state.onlyX=!state.onlyX; chip.setAttribute('aria-pressed',state.onlyX); }
    else { const k=chip.dataset.k; const i=state.kinds.indexOf(k);
           i<0?state.kinds.push(k):state.kinds.splice(i,1);
           chip.setAttribute('aria-pressed', state.kinds.includes(k)); }
    state.limit=60; save(); renderGrid(); renderList(); return; }
  const blk = e.target.closest('.blk');
  if(blk){ e.stopPropagation(); showCourse(blk.dataset.no); return; }
  const cell = e.target.closest('.cell');
  if(cell){ showSlot(+cell.dataset.d, +cell.dataset.p); return; }
  if(e.target.id==='more'){ state.limit+=120; renderList(); return; }
  if(e.target.id==='dClose'||e.target.id==='scrim'){ closeDrawer(); return; }
  if(e.target.id==='btnClear'){ if(picked.size&&confirm('清空模拟课表里的全部选课？')){ picked.clear(); save(); renderAll(); } return; }
  if(e.target.id==='btnCopy'){
    const arr=[...picked].sort();
    if(!arr.length){ toast('还没有选课'); return; }
    navigator.clipboard?.writeText(arr.join(' ')).then(()=>toast('已复制 '+arr.length+' 个选课序号'),
      ()=>prompt('选课序号：',arr.join(' ')));
    return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

const qEl=document.getElementById('q'); qEl.value=state.q;
let qt; qEl.addEventListener('input',()=>{ clearTimeout(qt); qt=setTimeout(()=>{
  state.q=qEl.value.trim(); state.limit=60; save(); renderGrid(); renderList(); },160); });

const unitEl=document.getElementById('unit');
unitEl.innerHTML = '<option value="">全部开课单位</option>' +
  U.slice().sort((a,b)=>a===HOME_UNIT?-1:b===HOME_UNIT?1:a.localeCompare(b,'zh'))
   .map(u=>`<option${u===state.unit?' selected':''}>${u}</option>`).join('');
unitEl.addEventListener('change',()=>{ state.unit=unitEl.value; state.limit=60; save(); renderGrid(); renderList(); });
const cpEl=document.getElementById('campus'); cpEl.value=state.campus;
cpEl.addEventListener('change',()=>{ state.campus=cpEl.value; state.limit=60; save(); renderGrid(); renderList(); });

document.querySelectorAll('#chips .chip').forEach(ch=>{
  if(ch.id==='chipEmpty') ch.setAttribute('aria-pressed',state.hideEmpty);
  else if(ch.id==='chipOnly') ch.setAttribute('aria-pressed',state.onlyAvail);
  else if(ch.id==='chipX') ch.setAttribute('aria-pressed',state.onlyX);
  else ch.setAttribute('aria-pressed', state.kinds.includes(ch.dataset.k));
});
document.getElementById('foot').innerHTML =
  `数据来自《南开大学 2026~2027 学年第一学期选课手册》与《南开大学 2026-2027 学年第一学期本科生选课通知》（教通字〔2026〕58 号），`+
  `共 ${CS.length} 个教学班、${CS.reduce((s,c)=>s+c.s.length,0)} 条上课安排，由 PDF 自动解析。`+
  `本页仅用于个人模拟排课，名额为手册公布值、不是实时余量；一切以教学管理信息系统 eamis.nankai.edu.cn 为准。`;

renderAll();
